<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>🧬 Polymer Architecture · 3D Molecular Viewer</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
      background: #f0f4fa;
      min-height: 100vh;
      overflow: hidden;
      position: relative;
    }

    /* Canvas container - full viewport */
    #canvas-container {
      width: 100%;
      height: 100vh;
      position: relative;
      background: radial-gradient(circle at 20% 30%, #f8fafc, #eef2f8);
    }

    /* ----- MODERN NAVBAR (Responsive, collapses to hamburger) ----- */
    .navbar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 100;
      background: rgba(255, 255, 255, 0.94);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid rgba(59, 130, 246, 0.2);
      padding: 0.75rem 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.03);
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      font-size: 1.1rem;
      color: #1e293b;
      letter-spacing: -0.3px;
    }
    .logo-icon {
      font-size: 1.5rem;
    }

    /* Desktop navigation menu */
    .nav-menu {
      display: flex;
      gap: 0.5rem;
      align-items: center;
      flex-wrap: wrap;
    }

    .nav-btn {
      background: transparent;
      border: none;
      padding: 0.6rem 1.2rem;
      border-radius: 60px;
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.2s ease;
      color: #475569;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .nav-btn:hover {
      background: #eef2ff;
      color: #3b82f6;
      transform: scale(0.96);
    }
    .nav-btn.active {
      background: linear-gradient(105deg, #3b82f6, #2563eb);
      color: white;
      box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
    }

    /* Hamburger button (mobile only) */
    .hamburger {
      display: none;
      background: rgba(255, 255, 255, 0.9);
      border: 1px solid #d0e2ff;
      border-radius: 60px;
      padding: 0.5rem 1rem;
      cursor: pointer;
      font-size: 1.2rem;
      font-weight: 600;
      color: #3b82f6;
      transition: 0.2s;
    }
    .hamburger:hover {
      background: #eef2ff;
    }

    /* Stats cards (compact, UI-driven) */
    .stats-container {
      position: fixed;
      bottom: 20px;
      left: 20px;
      right: 20px;
      max-width: 360px;
      margin: 0 auto;
      z-index: 90;
      pointer-events: none;
    }
    .stats-card {
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(16px);
      border-radius: 28px;
      padding: 14px 18px;
      border: 1px solid rgba(59, 130, 246, 0.25);
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.08);
      pointer-events: auto;
      transition: all 0.2s;
    }
    .stats-row {
      display: flex;
      gap: 16px;
      justify-content: space-around;
    }
    .stat-item {
      flex: 1;
      text-align: center;
      background: #f8fafc;
      border-radius: 20px;
      padding: 10px 8px;
    }
    .stat-label {
      font-size: 0.65rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #64748b;
      font-weight: 600;
    }
    .stat-value {
      font-size: 1.1rem;
      font-weight: 800;
      color: #3b82f6;
      margin-top: 4px;
    }
    .legend-mini {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-top: 12px;
      padding-top: 8px;
      border-top: 1px solid #e2e8f0;
      font-size: 0.7rem;
      color: #475569;
    }
    .legend-mini span {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .dot {
      width: 10px;
      height: 10px;
      border-radius: 10px;
      display: inline-block;
    }

    /* Instruction hint */
    .instruction {
      position: fixed;
      top: 80px;
      right: 20px;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(8px);
      padding: 6px 14px;
      border-radius: 60px;
      font-size: 0.65rem;
      color: #e2e8f0;
      pointer-events: none;
      z-index: 90;
      font-family: monospace;
    }

    /* Mobile responsive: hamburger menu */
    @media (max-width: 700px) {
      .hamburger {
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .nav-menu {
        position: fixed;
        top: 65px;
        left: -100%;
        flex-direction: column;
        background: rgba(255, 255, 255, 0.98);
        backdrop-filter: blur(20px);
        width: 80%;
        max-width: 280px;
        height: calc(100% - 65px);
        padding: 1.5rem;
        gap: 1rem;
        transition: left 0.3s ease;
        box-shadow: 4px 0 20px rgba(0, 0, 0, 0.1);
        border-right: 1px solid #d0e2ff;
        align-items: stretch;
        z-index: 200;
      }
      .nav-menu.open {
        left: 0;
      }
      .nav-btn {
        justify-content: center;
        padding: 0.8rem;
      }
      .instruction {
        top: 75px;
        right: 12px;
        font-size: 0.55rem;
      }
      .stats-container {
        left: 16px;
        right: 16px;
        max-width: calc(100% - 32px);
      }
    }

    /* Large desktop fix: center containers, max-width */
    @media (min-width: 1600px) {
      .stats-container {
        left: auto;
        right: auto;
        margin-left: auto;
        margin-right: auto;
      }
      .instruction {
        right: 40px;
      }
    }

    /* overlay for mobile menu */
    .menu-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.4);
      z-index: 150;
      opacity: 0;
      visibility: hidden;
      transition: 0.2s;
    }
    .menu-overlay.active {
      opacity: 1;
      visibility: visible;
    }
  </style>
</head>
<body>

<div id="canvas-container"></div>

<!-- Modern Navbar with hamburger (mobile) -->
<nav class="navbar">
  <div class="logo">
    <span class="logo-icon">🧬</span>
    <span>Polymer Architect</span>
  </div>
  <button class="hamburger" id="hamburgerBtn">☰ Menu</button>
  <div class="nav-menu" id="navMenu">
    <button class="nav-btn active" data-mode="linear">📏 Linear</button>
    <button class="nav-btn" data-mode="branched">🌿 Branched</button>
    <button class="nav-btn" data-mode="cross">🔗 Cross‑linked</button>
  </div>
</nav>
<div class="menu-overlay" id="menuOverlay"></div>

<!-- Compact stats card (replaces heavy text) -->
<div class="stats-container">
  <div class="stats-card">
    <div class="stats-row">
      <div class="stat-item">
        <div class="stat-label">Type</div>
        <div class="stat-value" id="typeDisp">Linear</div>
      </div>
      <div class="stat-item">
        <div class="stat-label">Density</div>
        <div class="stat-value" id="densityDisp">High</div>
      </div>
      <div class="stat-item">
        <div class="stat-label">Bonds</div>
        <div class="stat-value" id="bondCountDisp">—</div>
      </div>
    </div>
    <div class="legend-mini">
      <span><i class="dot" style="background:#475569;"></i> Carbon</span>
      <span><i class="dot" style="background:#3b82f6;"></i> Bond</span>
      <span>🖱️ Drag to rotate</span>
    </div>
  </div>
</div>

<div class="instruction">✨ Drag to rotate | Scroll zoom | Click polymer type</div>

<script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.128.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.128.0/examples/jsm/"
    }
  }
</script>

<script type="module">
  import * as THREE from 'three';
  import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

  // --- Setup Scene (responsive, large screen compatible) ---
  const container = document.getElementById('canvas-container');
  const scene = new THREE.Scene();
  scene.background = new THREE.Color('#f8fafc');
  scene.fog = new THREE.FogExp2(0xf8fafc, 0.008);

  const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
  camera.position.set(6, 4, 13);
  camera.lookAt(0, 0, 0);

  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(container.clientWidth, container.clientHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.shadowMap.enabled = true;
  container.appendChild(renderer.domElement);

  // Orbit controls with smooth interaction
  const controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.06;
  controls.rotateSpeed = 1.2;
  controls.zoomSpeed = 1.0;
  controls.enablePan = true;
  controls.target.set(0, 0.2, 0);

  // Lighting
  const ambient = new THREE.AmbientLight(0xffffff, 0.7);
  scene.add(ambient);
  const mainLight = new THREE.DirectionalLight(0xffffff, 1.0);
  mainLight.position.set(5, 8, 4);
  mainLight.castShadow = true;
  scene.add(mainLight);
  const fillLight = new THREE.PointLight(0xcbd5e1, 0.5);
  fillLight.position.set(0, 2, 5);
  scene.add(fillLight);
  const backLight = new THREE.PointLight(0x93c5fd, 0.3);
  backLight.position.set(-2, 1, -6);
  scene.add(backLight);

  // Group for polymer structure
  const polymerGroup = new THREE.Group();
  scene.add(polymerGroup);

  // DOM elements
  const typeDisplay = document.getElementById('typeDisp');
  const densityDisplay = document.getElementById('densityDisp');
  const bondCountSpan = document.getElementById('bondCountDisp');

  // Helper: add cylindrical bond between two points
  function addBond(start, end, color = '#3b82f6') {
    const direction = new THREE.Vector3().subVectors(end, start);
    const length = direction.length();
    const geometry = new THREE.CylinderGeometry(0.07, 0.07, length, 8);
    const material = new THREE.MeshStandardMaterial({ color: color, metalness: 0.3, roughness: 0.4 });
    const cylinder = new THREE.Mesh(geometry, material);
    cylinder.position.copy(start.clone().add(end).multiplyScalar(0.5));
    cylinder.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), direction.clone().normalize());
    polymerGroup.add(cylinder);
    return cylinder;
  }

  // Helper: add carbon atom
  function addCarbon(pos, color = '#475569') {
    const geometry = new THREE.SphereGeometry(0.32, 24, 24);
    const material = new THREE.MeshStandardMaterial({ color: color, metalness: 0.2, roughness: 0.3 });
    const sphere = new THREE.Mesh(geometry, material);
    sphere.position.copy(pos);
    sphere.castShadow = true;
    polymerGroup.add(sphere);
    return sphere;
  }

  // Bond counter
  let currentBondCount = 0;

  function clearPolymer() {
    while (polymerGroup.children.length) {
      polymerGroup.remove(polymerGroup.children[0]);
    }
    currentBondCount = 0;
  }

  // ---- Polymer Architecture Builders ----
  function buildLinear() {
    clearPolymer();
    const points = [];
    for (let i = -5; i <= 5; i++) {
      const x = i * 1.25;
      const z = Math.sin(i * 0.7) * 0.25;
      const pos = new THREE.Vector3(x, 0, z);
      addCarbon(pos);
      points.push(pos);
      if (i < 5) {
        addBond(pos, new THREE.Vector3((i + 1) * 1.25, 0, Math.sin((i + 1) * 0.7) * 0.25));
        currentBondCount++;
      }
    }
    typeDisplay.textContent = 'Linear';
    densityDisplay.textContent = 'High';
    bondCountSpan.textContent = currentBondCount;
  }

  function buildBranched() {
    clearPolymer();
    const mainPoints = [];
    for (let i = -4; i <= 4; i++) {
      const x = i * 1.45;
      const pos = new THREE.Vector3(x, 0, 0);
      addCarbon(pos);
      mainPoints.push(pos);
      if (i < 4) {
        addBond(pos, new THREE.Vector3((i + 1) * 1.45, 0, 0));
        currentBondCount++;
      }
      // branches at even positions (except center)
      if (i % 2 === 0 && i !== 0) {
        const branchPos = new THREE.Vector3(x, 1.2, 0.25);
        addCarbon(branchPos, '#3b82f6'); // branch carbon (slightly different tone)
        addBond(pos, branchPos);
        currentBondCount++;
      }
    }
    typeDisplay.textContent = 'Branched';
    densityDisplay.textContent = 'Medium';
    bondCountSpan.textContent = currentBondCount;
  }

  function buildCrossLinked() {
    clearPolymer();
    const rows = 3;
    const cols = 7;
    const spacingX = 1.35;
    const spacingY = 1.25;
    const startX = - (cols - 1) * spacingX / 2;
    const startY = -0.8;
    
    const grid = [];
    for (let r = 0; r < rows; r++) {
      grid[r] = [];
      for (let c = 0; c < cols; c++) {
        const x = startX + c * spacingX;
        const y = startY + r * spacingY;
        const pos = new THREE.Vector3(x, y, 0);
        addCarbon(pos);
        grid[r][c] = pos;
        // horizontal bonds within row
        if (c < cols - 1) {
          addBond(pos, new THREE.Vector3(startX + (c + 1) * spacingX, y, 0));
          currentBondCount++;
        }
        // vertical cross-links between rows at specific columns (mid region)
        if (r > 0 && (c === 2 || c === 4 || c === 3)) {
          const abovePos = new THREE.Vector3(x, startY + (r - 1) * spacingY, 0);
          addBond(pos, abovePos);
          currentBondCount++;
        }
      }
    }
    typeDisplay.textContent = 'Cross‑linked';
    densityDisplay.textContent = 'Rigid';
    bondCountSpan.textContent = currentBondCount;
  }

  // --- Menu / Navigation Logic with responsive hamburger ---
  const navBtns = document.querySelectorAll('.nav-btn');
  const hamburger = document.getElementById('hamburgerBtn');
  const navMenu = document.getElementById('navMenu');
  const menuOverlay = document.getElementById('menuOverlay');

  function setActiveMode(mode) {
    navBtns.forEach(btn => {
      if (btn.dataset.mode === mode) {
        btn.classList.add('active');
      } else {
        btn.classList.remove('active');
      }
    });
    if (mode === 'linear') buildLinear();
    else if (mode === 'branched') buildBranched();
    else if (mode === 'cross') buildCrossLinked();
    
    // close mobile menu after selection
    if (window.innerWidth <= 700) {
      navMenu.classList.remove('open');
      menuOverlay.classList.remove('active');
    }
  }

  navBtns.forEach(btn => {
    btn.addEventListener('click', () => {
      const mode = btn.dataset.mode;
      setActiveMode(mode);
    });
  });

  // Hamburger toggle
  function toggleMobileMenu() {
    navMenu.classList.toggle('open');
    menuOverlay.classList.toggle('active');
  }
  hamburger.addEventListener('click', toggleMobileMenu);
  menuOverlay.addEventListener('click', () => {
    navMenu.classList.remove('open');
    menuOverlay.classList.remove('active');
  });

  // close on window resize if open
  window.addEventListener('resize', () => {
    if (window.innerWidth > 700 && navMenu.classList.contains('open')) {
      navMenu.classList.remove('open');
      menuOverlay.classList.remove('active');
    }
    // update camera aspect
    const w = container.clientWidth;
    const h = container.clientHeight;
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
    renderer.setSize(w, h);
  });

  // initial build
  buildLinear();

  // Animation loop
  function animate() {
    requestAnimationFrame(animate);
    controls.update(); // smooth damping
    renderer.render(scene, camera);
  }
  animate();

  // handle canvas resize properly
  window.addEventListener('resize', () => {
    const w = container.clientWidth;
    const h = container.clientHeight;
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
    renderer.setSize(w, h);
  });

  // small console confirmation
  console.log('Polymer Lab | Responsive navbar + menu-driven UI | Large screen optimized');
</script>
</body>
</html>
