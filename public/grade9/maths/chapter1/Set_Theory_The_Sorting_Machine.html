<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
/>

<title>Responsive Set Sorter</title>

<style>
    *{
        margin:0;
        padding:0;
        box-sizing:border-box;
        user-select:none;
    }

    html,
    body{
        width:100%;
        height:100%;
        overflow:hidden;
        font-family:
            Inter,
            system-ui,
            -apple-system,
            BlinkMacSystemFont,
            "Segoe UI",
            sans-serif;
        background:#f5f7fb;
        color:#0f172a;
    }

    canvas{
        width:100%;
        height:100%;
        display:block;
        touch-action:none;
    }

    .ui{
        position:absolute;
        inset:0;
        pointer-events:none;
        z-index:10;
    }

    .card{
        position:absolute;
        top:18px;
        right:18px;
        width:290px;

        background:rgba(255,255,255,0.92);

        backdrop-filter:blur(12px);

        border-radius:28px;

        border:1px solid rgba(0,0,0,0.05);

        padding:18px;

        pointer-events:auto;

        box-shadow:
            0 8px 24px rgba(0,0,0,0.03),
            0 2px 4px rgba(0,0,0,0.02);
    }

    .section-title{
        font-size:0.72rem;
        text-transform:uppercase;
        letter-spacing:0.5px;
        font-weight:700;
        color:#64748b;
        margin-bottom:12px;
    }

    .btn-grid{
        display:grid;
        grid-template-columns:1fr 1fr;
        gap:8px;
        margin-bottom:18px;
    }

    .btn{
        border:none;
        border-radius:999px;
        background:white;
        border:1px solid #dbe4ef;
        padding:10px 12px;
        cursor:pointer;

        transition:0.2s;

        font-size:0.85rem;
        font-weight:600;
        color:#0f172a;
    }

    .btn:hover{
        transform:translateY(-1px);
        background:#f8fafc;
    }

    .btn.active{
        background:#0f172a;
        color:white;
        border-color:#0f172a;
    }

    .btn.danger{
        background:#fff1f2;
        color:#e11d48;
        border-color:#fecdd3;
    }

    .log-area{
        height:110px;
        overflow-y:auto;

        background:#f8fafc;

        border-radius:18px;

        border:1px solid #edf2f7;

        padding:10px;

        font-size:0.75rem;

        font-family:monospace;
    }

    .log-entry{
        padding:5px 0 5px 8px;
        margin-bottom:5px;

        border-left:2px solid #3b82f6;

        animation:fadeSlide 0.2s ease;
    }

    .log-entry.fail{
        border-left-color:#f43f5e;
        color:#be123c;
    }

    @keyframes fadeSlide{
        from{
            opacity:0;
            transform:translateX(5px);
        }
        to{
            opacity:1;
            transform:translateX(0);
        }
    }

    .instruction-badge{
        position:absolute;
        left:50%;
        bottom:20px;
        transform:translateX(-50%);

        background:rgba(255,255,255,0.92);

        backdrop-filter:blur(10px);

        border-radius:999px;

        padding:10px 20px;

        font-size:0.82rem;
        font-weight:600;

        box-shadow:
            0 4px 14px rgba(0,0,0,0.03);

        white-space:nowrap;
    }

    .log-area::-webkit-scrollbar{
        width:5px;
    }

    .log-area::-webkit-scrollbar-thumb{
        background:#cbd5e1;
        border-radius:999px;
    }

    @media(max-width:768px){

        .card{
            width:calc(100% - 24px);
            left:12px;
            right:12px;
            top:12px;
            padding:14px;
        }

        .btn{
            font-size:0.75rem;
            padding:8px;
        }

        .log-area{
            height:90px;
        }

        .instruction-badge{
            width:calc(100% - 24px);
            text-align:center;
            white-space:normal;
            line-height:1.4;
            bottom:12px;
            font-size:0.72rem;
        }
    }

    @media(max-height:700px){

        .card{
            max-height:72vh;
            overflow-y:auto;
        }
    }
</style>
</head>

<body>

<canvas id="canvas"></canvas>

<div class="ui">

    <div class="card">

        <div class="section-title">⚡ Set definition</div>

        <div class="btn-grid" id="rule-group">
            <button data-rule="vowels" class="btn active">Vowels</button>
            <button data-rule="multiples" class="btn">Mult. of 3</button>
            <button data-rule="primes" class="btn">Primes</button>
            <button data-rule="vague" class="btn danger">Vague set</button>
        </div>

        <div class="section-title">🕹️ Mode</div>

        <div class="btn-grid">
            <button id="manualToggleBtn" class="btn">Manual mode</button>
            <button id="resetBtn" class="btn">Reset</button>
        </div>

        <div class="section-title">📋 Activity</div>

        <div class="log-area" id="logPanel">
            <div class="log-entry">
                ✓ system ready · drag elements
            </div>
        </div>

    </div>

    <div class="instruction-badge" id="statusMsg">
        ✨ drag into scanner → auto-sort
    </div>

</div>

<script>

(() => {

    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");

    const logPanel = document.getElementById("logPanel");
    const statusMsg = document.getElementById("statusMsg");

    let width;
    let height;

    let isMobile = false;

    let elements = [];

    let currentRule = "vowels";

    let manualMode = false;

    let draggedElement = null;

    let dragOffsetX = 0;
    let dragOffsetY = 0;

    let scannerPulse = 0;
    let scannerPulseColor = "#3b82f6";

    const RULES = {

        vowels:{
            name:"Vowels",
            check:(v)=>
                ['a','e','i','o','u']
                .includes(v.toLowerCase()),

            pool:['A','B','E','X','I','M','U','O','Z','Y']
        },

        multiples:{
            name:"Multiples of 3",
            check:(v)=>parseInt(v)%3===0,
            pool:['1','3','4','6','8','9','12','13','15','2']
        },

        primes:{
            name:"Primes",
            check:(v)=>{

                const n = parseInt(v);

                if(n < 2 || isNaN(n)) return false;

                for(let i=2;i<=Math.sqrt(n);i++){
                    if(n%i===0) return false;
                }

                return true;
            },

            pool:['2','3','4','5','6','7','8','9','11','13']
        },

        vague:{
            name:"Undefined",
            check:null,
            pool:['?','★','♢','◈','✧','∞','⚡','❤','✓','✗']
        }
    };

    class FlowElement{

        constructor(value,x,y){

            this.value = value;

            this.x = x;
            this.y = y;

            this.targetX = x;
            this.targetY = y;

            this.size = isMobile ? 30 : 42;

            this.status = "belt";

            this.vx = 0;
            this.vy = 0;

            this.opacity = 1;
        }

        update(){

            if(this === draggedElement) return;

            if(this.status === "belt"){

                this.x += (this.targetX - this.x) * 0.12;
                this.y += (this.targetY - this.y) * 0.12;
            }
            else{

                this.x += this.vx;
                this.y += this.vy;

                this.opacity -= 0.012;
            }
        }

        draw(){

            ctx.save();

            ctx.globalAlpha = this.opacity;

            ctx.beginPath();

            ctx.arc(
                this.x,
                this.y,
                this.size * 0.65,
                0,
                Math.PI * 2
            );

            ctx.fillStyle = "white";

            ctx.fill();

            ctx.lineWidth = 2;

            ctx.strokeStyle =
                this.status === "belt"
                ? "#cbd5e1"
                : (
                    this.status === "member"
                    ? "#3b82f6"
                    : "#f43f5e"
                );

            ctx.stroke();

            ctx.fillStyle = "#0f172a";

            ctx.font = `
                600
                ${isMobile ? 16 : 22}px
                Inter
            `;

            ctx.textAlign = "center";
            ctx.textBaseline = "middle";

            ctx.fillText(
                this.value,
                this.x,
                this.y
            );

            ctx.restore();
        }
    }

    function addLog(text,error=false){

        const div = document.createElement("div");

        div.className =
            `log-entry ${error ? 'fail' : ''}`;

        div.innerText =
            `${error ? '⚠' : '→'} ${text}`;

        logPanel.prepend(div);

        if(logPanel.children.length > 18){
            logPanel.removeChild(logPanel.lastChild);
        }
    }

    function resizeCanvas(){

        width = window.innerWidth;
        height = window.innerHeight;

        canvas.width = width;
        canvas.height = height;

        isMobile = width < 768;

        repositionBeltItems();
    }

    function spawnElements(){

        elements = [];

        const pool = RULES[currentRule].pool;

        for(let i=0;i<pool.length;i++){

            const y =
                (isMobile ? 120 : 150)
                +
                (i % (isMobile ? 5 : 6))
                *
                (isMobile ? 62 : 82);

            elements.push(
                new FlowElement(
                    pool[i],
                    isMobile ? 40 : 70,
                    y
                )
            );
        }

        repositionBeltItems();
    }

    function repositionBeltItems(){

        const startX = isMobile ? 45 : 70;
        const startY = isMobile ? 120 : 150;

        const stepY = isMobile ? 62 : 82;

        elements.forEach((el,idx)=>{

            if(el.status !== "belt") return;

            const column =
                isMobile
                ? Math.floor(idx / 5)
                : 0;

            const row =
                isMobile
                ? idx % 5
                : idx % 7;

            el.targetX = startX + column * 70;
            el.targetY = startY + row * stepY;
        });
    }

    function drawBackground(){

        ctx.fillStyle = "#f5f7fb";
        ctx.fillRect(0,0,width,height);

        const midX = width / 2;
        const midY = height / 2;

        ctx.fillStyle = "#e9eef7";

        ctx.fillRect(
            isMobile ? 15 : 40,
            midY - (isMobile ? 30 : 45),
            midX - (isMobile ? 30 : 80),
            isMobile ? 60 : 90
        );

        ctx.fillStyle = "#d6e0ee";

        for(let i=20;i<midX-40;i+=40){

            ctx.fillRect(
                i,
                midY - 8,
                18,
                16
            );
        }

        ctx.lineWidth = isMobile ? 3 : 4;

        ctx.beginPath();

        ctx.moveTo(midX + 50,midY);

        ctx.quadraticCurveTo(
            midX + 110,
            midY,
            midX + 160,
            midY - (isMobile ? 80 : 120)
        );

        ctx.lineTo(
            width - 40,
            midY - (isMobile ? 80 : 120)
        );

        ctx.strokeStyle = "#3b82f680";

        ctx.stroke();

        ctx.beginPath();

        ctx.moveTo(midX + 50,midY);

        ctx.quadraticCurveTo(
            midX + 110,
            midY,
            midX + 160,
            midY + (isMobile ? 80 : 120)
        );

        ctx.lineTo(
            width - 40,
            midY + (isMobile ? 80 : 120)
        );

        ctx.strokeStyle = "#f43f5e80";

        ctx.stroke();

        ctx.font =
            isMobile
            ? "600 10px Inter"
            : "600 12px Inter";

        ctx.fillStyle = "#3b82f6";

        ctx.fillText(
            "member zone ∈ A",
            width - (isMobile ? 135 : 160),
            midY - (isMobile ? 95 : 135)
        );

        ctx.fillStyle = "#f43f5e";

        ctx.fillText(
            "reject zone ∉ A",
            width - (isMobile ? 135 : 160),
            midY + (isMobile ? 105 : 145)
        );
    }

    function drawScanner(){

        const cx = width / 2;
        const cy = height / 2;

        const scannerW = isMobile ? 140 : 190;
        const scannerH = isMobile ? 170 : 220;

        ctx.save();

        ctx.fillStyle = "white";

        ctx.shadowBlur = 12;
        ctx.shadowColor = "rgba(0,0,0,0.04)";

        ctx.fillRect(
            cx - scannerW/2,
            cy - scannerH/2,
            scannerW,
            scannerH
        );

        ctx.fillStyle = "#f8fafc";

        ctx.fillRect(
            cx - scannerW/2 + 8,
            cy - scannerH/2 + 8,
            scannerW - 16,
            scannerH - 16
        );

        ctx.fillStyle = "#eef2f7";

        ctx.fillRect(
            cx - scannerW/2 + 16,
            cy - scannerH/2 + 16,
            scannerW - 32,
            55
        );

        ctx.font =
            isMobile
            ? "600 10px Inter"
            : "600 11px Inter";

        ctx.fillStyle = "#475569";

        ctx.fillText(
            "set A:",
            cx - 25,
            cy - scannerH/2 + 36
        );

        ctx.font =
            isMobile
            ? "700 13px Inter"
            : "700 16px Inter";

        ctx.fillStyle = "#0f172a";

        let label =
            currentRule === "vague"
            ? "❓ undefined"
            : RULES[currentRule].name;

        ctx.fillText(
            label,
            cx - 35,
            cy - scannerH/2 + 58
        );

        ctx.strokeStyle =
            scannerPulse > 0
            ? scannerPulseColor
            : "#cbd5e1";

        ctx.lineWidth = 3;

        ctx.strokeRect(
            cx - scannerW/2 + 16,
            cy - 10,
            scannerW - 32,
            isMobile ? 58 : 85
        );

        if(scannerPulse > 0){

            ctx.globalAlpha = 0.2;

            ctx.fillStyle = scannerPulseColor;

            ctx.fillRect(
                cx - scannerW/2 + 16,
                cy - 10,
                scannerW - 32,
                isMobile ? 58 : 85
            );

            ctx.globalAlpha = 1;

            scannerPulse--;
        }

        ctx.restore();
    }

    function processElement(el,manualOverride=null){

        const ruleObj = RULES[currentRule];

        if(currentRule === "vague"){

            el.status = "excluded";

            el.vx = (Math.random() - 0.5) * 8;
            el.vy = (Math.random() - 0.5) * 8;

            addLog(
                `"${el.value}" · undefined set`,
                true
            );

            scannerPulse = 18;
            scannerPulseColor = "#f97316";

            return;
        }

        const belongs = ruleObj.check(el.value);

        if(manualOverride !== null){

            const userChoice =
                manualOverride === "member";

            if(userChoice !== belongs){

                addLog(
                    `"${el.value}" incorrect placement`,
                    true
                );

                repositionBeltItems();

                return;
            }
        }

        el.status =
            belongs
            ? "member"
            : "excluded";

        el.vx = 6;

        el.vy =
            belongs
            ? -3
            : 3;

        scannerPulse = 18;

        scannerPulseColor =
            belongs
            ? "#3b82f6"
            : "#f43f5e";

        addLog(
            `${el.value} ${belongs ? '∈' : '∉'} ${ruleObj.name}`,
            !belongs
        );
    }

    function draw(){

        drawBackground();

        drawScanner();

        elements.forEach(el => el.draw());
    }

    function update(){

        elements.forEach(el => el.update());

        elements =
            elements.filter(el => el.opacity > 0.03);

        if(elements.length < 5){

            const pool = RULES[currentRule].pool;

            const value =
                pool[Math.floor(Math.random() * pool.length)];

            const y =
                (isMobile ? 120 : 150)
                +
                (elements.length % 5)
                *
                (isMobile ? 62 : 82);

            const el =
                new FlowElement(value,20,y);

            elements.push(el);

            repositionBeltItems();
        }
    }

    function animate(){

        update();

        draw();

        requestAnimationFrame(animate);
    }

    function getPos(e){

        const rect = canvas.getBoundingClientRect();

        const x =
            e.touches
            ? e.touches[0].clientX
            : e.clientX;

        const y =
            e.touches
            ? e.touches[0].clientY
            : e.clientY;

        return {
            x:x - rect.left,
            y:y - rect.top
        };
    }

    function pointerDown(e){

        e.preventDefault();

        const pos = getPos(e);

        draggedElement =
            elements.find(el => {

                const dx = el.x - pos.x;
                const dy = el.y - pos.y;

                return Math.hypot(dx,dy) < el.size;
            });

        if(draggedElement){

            dragOffsetX =
                draggedElement.x - pos.x;

            dragOffsetY =
                draggedElement.y - pos.y;
        }
    }

    function pointerMove(e){

        if(!draggedElement) return;

        e.preventDefault();

        const pos = getPos(e);

        draggedElement.x =
            pos.x + dragOffsetX;

        draggedElement.y =
            pos.y + dragOffsetY;
    }

    function pointerUp(e){

        if(!draggedElement) return;

        e.preventDefault();

        const scannerX = width / 2;
        const scannerY = height / 2;

        const inScanner =
            Math.hypot(
                draggedElement.x - scannerX,
                draggedElement.y - scannerY
            ) < 90;

        if(manualMode){

            if(draggedElement.y < scannerY - 60){

                processElement(
                    draggedElement,
                    "member"
                );
            }
            else if(draggedElement.y > scannerY + 60){

                processElement(
                    draggedElement,
                    "excluded"
                );
            }
            else{
                repositionBeltItems();
            }
        }
        else{

            if(inScanner){

                processElement(draggedElement);
            }
            else{
                repositionBeltItems();
            }
        }

        draggedElement = null;
    }

    function setRule(rule,btn){

        currentRule = rule;

        document
            .querySelectorAll("#rule-group .btn")
            .forEach(b=>b.classList.remove("active"));

        btn.classList.add("active");

        spawnElements();

        addLog(`rule changed → ${RULES[rule].name}`);
    }

    function toggleManualMode(){

        manualMode = !manualMode;

        const btn =
            document.getElementById("manualToggleBtn");

        btn.classList.toggle("active");

        btn.innerText =
            manualMode
            ? "Auto mode"
            : "Manual mode";

        statusMsg.innerText =
            manualMode
            ? "✋ drag above or below scanner"
            : "✨ drag into scanner";
    }

    function reset(){

        spawnElements();

        addLog("system reset");
    }

    function bindEvents(){

        window.addEventListener("resize",resizeCanvas);

        canvas.addEventListener("mousedown",pointerDown);

        window.addEventListener("mousemove",pointerMove);

        window.addEventListener("mouseup",pointerUp);

        canvas.addEventListener(
            "touchstart",
            pointerDown,
            {passive:false}
        );

        window.addEventListener(
            "touchmove",
            pointerMove,
            {passive:false}
        );

        window.addEventListener(
            "touchend",
            pointerUp
        );

        document
            .getElementById("manualToggleBtn")
            .addEventListener(
                "click",
                toggleManualMode
            );

        document
            .getElementById("resetBtn")
            .addEventListener(
                "click",
                reset
            );

        document
            .querySelectorAll("#rule-group .btn")
            .forEach(btn => {

                btn.addEventListener("click",() => {

                    const rule =
                        btn.getAttribute("data-rule");

                    if(rule){
                        setRule(rule,btn);
                    }
                });
            });
    }

    resizeCanvas();

    spawnElements();

    bindEvents();

    animate();

})();
</script>

</body>
</html>
