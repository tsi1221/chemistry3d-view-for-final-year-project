<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Set Theory | White Canvas · Blue Elements</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: #ffffff;
            overflow: hidden;
            font-family: 'Inter', 'SF Pro Text', system-ui, -apple-system, 'Segoe UI', monospace;
            touch-action: none;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            cursor: grab;
            touch-action: none;
            background: #ffffff;
        }

        canvas:active {
            cursor: grabbing;
        }

        /* MINIMALIST HUD — clean blue tones on white background */
        .hud {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            padding: 8px 18px;
            border-radius: 48px;
            border: 1px solid rgba(0, 100, 200, 0.25);
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.05), 0 0 0 0.5px rgba(0, 100, 200, 0.2);
            pointer-events: none;
            z-index: 30;
            transition: 0.2s;
        }

        .status-badge {
            font-size: 0.7rem;
            font-weight: 700;
            letter-spacing: 2px;
            color: #0066cc;
            text-transform: uppercase;
        }

        .notation-mini {
            font-size: 0.9rem;
            font-weight: 600;
            font-family: 'Times New Roman', 'Georgia', serif;
            color: #0a2a44;
            letter-spacing: 0.3px;
        }

        /* bottom-right counter — crisp blue */
        .counter-tiny {
            position: absolute;
            bottom: 20px;
            right: 20px;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(8px);
            padding: 6px 16px;
            border-radius: 40px;
            font-size: 0.75rem;
            font-weight: 600;
            font-family: 'JetBrains Mono', monospace;
            color: #0055aa;
            border: 1px solid rgba(0, 100, 200, 0.3);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.03);
            pointer-events: none;
            z-index: 30;
            letter-spacing: 0.4px;
            white-space: nowrap;
        }

        /* subtle gesture hint — light grey/blue */
        .gesture-hint {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(240, 248, 255, 0.85);
            backdrop-filter: blur(6px);
            padding: 5px 14px;
            border-radius: 40px;
            font-size: 0.55rem;
            font-weight: 500;
            color: #0066aa;
            font-family: monospace;
            pointer-events: none;
            z-index: 30;
            white-space: nowrap;
            letter-spacing: 0.4px;
            border: 0.5px solid rgba(0, 100, 200, 0.3);
        }

        @media (max-width: 560px) {
            .hud {
                top: 12px;
                left: 12px;
                padding: 5px 14px;
            }
            .status-badge {
                font-size: 0.55rem;
                letter-spacing: 1.5px;
            }
            .notation-mini {
                font-size: 0.75rem;
            }
            .counter-tiny {
                bottom: 14px;
                right: 14px;
                padding: 4px 12px;
                font-size: 0.6rem;
            }
            .gesture-hint {
                bottom: 12px;
                font-size: 0.5rem;
                padding: 3px 10px;
            }
        }

        /* active finite set pulse — soft blue border glow */
        @keyframes softBluePulse {
            0% { border-color: rgba(0, 100, 200, 0.3); box-shadow: 0 0 0px rgba(0, 120, 255, 0.2);}
            100% { border-color: rgba(0, 120, 255, 0.7); box-shadow: 0 0 10px rgba(0, 120, 255, 0.3);}
        }
        .hud.finite-active {
            animation: softBluePulse 1.4s infinite alternate;
        }
    </style>
</head>
<body>

<div class="hud" id="hudCard">
    <div class="status-badge" id="statusLabel">∅ EMPTY</div>
    <div class="notation-mini" id="setNotation">∅</div>
</div>
<div class="counter-tiny" id="countDisplay">|A| = 0</div>
<div class="gesture-hint">✧ drag | pinch zoom | double-tap reset ✧</div>

<canvas id="setCanvas"></canvas>

<script>
    (function(){
        // ========== WHITE BACKGROUND + BLUE VISUALIZER ==========
        // Mathematical core: 1000 numeric elements (0...999)
        // Set A = elements inside the seeker circle (dynamic)
        // Infinite set condition when zoom < 0.07 (cosmic scale reveals infinite numbers)
        // Pure white canvas, deep blue elements & selection ring.
        
        const canvas = document.getElementById('setCanvas');
        const ctx = canvas.getContext('2d');
        
        // DOM elements
        const hudDiv = document.getElementById('hudCard');
        const statusLabel = document.getElementById('statusLabel');
        const setNotationSpan = document.getElementById('setNotation');
        const countSpan = document.getElementById('countDisplay');
        
        let width, height;
        let zoom = 1.0;
        let offsetX = 0, offsetY = 0;
        let isDragging = false;
        let lastDragPoint = { x: 0, y: 0 };
        
        const STAR_COUNT = 1000;      // 1000 numbers (0..999)
        let stars = [];
        const SEEKER_RADIUS = 110;     // selection radius in screen pixels
        
        // ---- generate numeric stars scattered in a wide space ----
        function generateStars() {
            stars = [];
            for (let i = 0; i < STAR_COUNT; i++) {
                stars.push({
                    value: i,
                    x: (Math.random() - 0.5) * 4800,
                    y: (Math.random() - 0.5) * 4800,
                    baseSize: 9 + Math.random() * 12
                });
            }
        }
        
        // resize canvas
        function resizeCanvas() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        
        // Update UI: Empty / Finite / Infinite (mathematically accurate)
        function updateSetDisplay(activeCount, currentZoom) {
            // INFINITE condition: zoom extremely low -> representation of ℕ
            if (currentZoom < 0.07) {
                statusLabel.innerText = "∞ INFINITE";
                setNotationSpan.innerText = "ℕ = {0,1,2,…}";
                countSpan.innerText = "|A| = ∞";
                hudDiv.classList.remove('finite-active');
                return;
            }
            
            // EMPTY or FINITE based on captured stars inside ring
            if (activeCount === 0) {
                statusLabel.innerText = "∅ EMPTY";
                setNotationSpan.innerText = "∅";
                countSpan.innerText = "|A| = 0";
                hudDiv.classList.remove('finite-active');
            } else {
                statusLabel.innerText = "✦ FINITE SET";
                setNotationSpan.innerText = `A = { ${activeCount} element${activeCount !== 1 ? 's' : ''} }`;
                countSpan.innerText = `|A| = ${activeCount}`;
                hudDiv.classList.add('finite-active');
            }
        }
        
        // -------------- DRAWING: PURE WHITE BACKGROUND + BLUE NUMBERS --------------
        function draw() {
            if (!ctx) return;
            
            // solid white background (clean, minimal)
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, width, height);
            
            // subtle faint blue grid/dots for depth (barely visible)
            ctx.fillStyle = '#cce4ff';
            for (let i = 0; i < 180; i++) {
                ctx.beginPath();
                ctx.arc( (i * 181) % width, (i * 97) % height, 1.2, 0, Math.PI * 2);
                ctx.fill();
            }
            
            const centerX = width / 2;
            const centerY = height / 2;
            let insideCount = 0;
            
            // ---- draw numeric stars (blue scale, members bright blue) ----
            stars.forEach(star => {
                // world to screen transformation
                const screenX = centerX + (star.x + offsetX) * zoom;
                const screenY = centerY + (star.y + offsetY) * zoom;
                
                const distToSeeker = Math.hypot(screenX - centerX, screenY - centerY);
                const isInsideSet = distToSeeker < SEEKER_RADIUS;
                if (isInsideSet) insideCount++;
                
                // culling: only render if visible with padding
                if (screenX > -100 && screenX < width + 100 && screenY > -100 && screenY < height + 100) {
                    ctx.save();
                    
                    if (isInsideSet) {
                        // MEMBERS: vibrant deep blue, strong presence
                        ctx.shadowBlur = 8;
                        ctx.shadowColor = '#3399ff';
                        ctx.fillStyle = '#0066cc';
                        ctx.globalAlpha = 1;
                    } else {
                        // outside elements: soft light blue, less opacity
                        ctx.shadowBlur = 1;
                        ctx.shadowColor = '#aaccff';
                        ctx.fillStyle = '#7a9ec2';
                        ctx.globalAlpha = 0.45;
                    }
                    
                    // dynamic font size based on zoom
                    let fontSize = Math.max(8, star.baseSize * zoom * 0.85);
                    fontSize = Math.min(fontSize, 26);
                    ctx.font = `${fontSize}px "SF Mono", "JetBrains Mono", "Courier New", monospace`;
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    
                    ctx.fillText(star.value, screenX, screenY);
                    ctx.restore();
                }
            });
            
            // ------- SEEKER RING (boundary of set A) -------
            ctx.save();
            ctx.beginPath();
            ctx.arc(centerX, centerY, SEEKER_RADIUS, 0, Math.PI * 2);
            
            // ring styling: vibrant blue, solid when finite set active
            if (insideCount > 0) {
                ctx.strokeStyle = '#2288ff';
                ctx.lineWidth = 3;
                ctx.shadowBlur = 10;
                ctx.shadowColor = '#66aaff';
            } else {
                ctx.strokeStyle = '#89b9e6';
                ctx.lineWidth = 2.2;
                ctx.shadowBlur = 3;
                ctx.shadowColor = '#bbddff';
            }
            ctx.setLineDash([9, 7]);
            ctx.stroke();
            ctx.setLineDash([]);
            
            // extra inner/outer accents for active finite state
            if (insideCount > 0) {
                ctx.beginPath();
                ctx.arc(centerX, centerY, SEEKER_RADIUS - 2, 0, Math.PI * 2);
                ctx.strokeStyle = '#3399ff80';
                ctx.lineWidth = 1.5;
                ctx.stroke();
                ctx.beginPath();
                ctx.arc(centerX, centerY, SEEKER_RADIUS + 4, 0, Math.PI * 2);
                ctx.strokeStyle = '#2288ff60';
                ctx.lineWidth = 1.8;
                ctx.stroke();
            }
            
            // center focal point: crisp dark blue dot (anchor)
            ctx.beginPath();
            ctx.arc(centerX, centerY, 4, 0, 2 * Math.PI);
            ctx.fillStyle = '#004c99';
            ctx.shadowBlur = 8;
            ctx.shadowColor = '#88bbff';
            ctx.fill();
            ctx.beginPath();
            ctx.arc(centerX, centerY, 1.5, 0, 2 * Math.PI);
            ctx.fillStyle = '#ffffff';
            ctx.fill();
            
            ctx.restore();
            
            // ---- update minimal HUD based on current state ----
            updateSetDisplay(insideCount, zoom);
        }
        
        function animate() {
            draw();
            requestAnimationFrame(animate);
        }
        
        // ===================== INTERACTION (FULL TOUCH + MOUSE) =====================
        // unified drag and pinch zoom with double-tap reset
        
        function startDrag(clientX, clientY) {
            isDragging = true;
            lastDragPoint = { x: clientX, y: clientY };
            canvas.style.cursor = 'grabbing';
        }
        
        function moveDrag(clientX, clientY) {
            if (!isDragging) return;
            const deltaX = (clientX - lastDragPoint.x) / zoom;
            const deltaY = (clientY - lastDragPoint.y) / zoom;
            offsetX += deltaX;
            offsetY += deltaY;
            lastDragPoint = { x: clientX, y: clientY };
        }
        
        function endDrag() {
            isDragging = false;
            canvas.style.cursor = 'grab';
        }
        
        // --- mouse handlers ---
        canvas.addEventListener('mousedown', (e) => {
            e.preventDefault();
            startDrag(e.clientX, e.clientY);
        });
        window.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            e.preventDefault();
            moveDrag(e.clientX, e.clientY);
        });
        window.addEventListener('mouseup', () => endDrag());
        canvas.addEventListener('contextmenu', (e) => e.preventDefault());
        
        // --- touch handlers (full mobile support) ---
        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            if (e.touches.length === 1) {
                const touch = e.touches[0];
                startDrag(touch.clientX, touch.clientY);
            }
        }, { passive: false });
        
        window.addEventListener('touchmove', (e) => {
            if (!isDragging) return;
            if (e.touches.length === 1) {
                e.preventDefault();
                const touch = e.touches[0];
                moveDrag(touch.clientX, touch.clientY);
            }
        }, { passive: false });
        
        window.addEventListener('touchend', (e) => {
            e.preventDefault();
            endDrag();
        });
        window.addEventListener('touchcancel', (e) => {
            e.preventDefault();
            endDrag();
        });
        
        // Pinch zoom logic for touch devices
        let initialPinchDistance = null;
        let initialZoomValue = 1;
        
        function getPinchDistance(touches) {
            if (touches.length < 2) return 0;
            const dx = touches[0].clientX - touches[1].clientX;
            const dy = touches[0].clientY - touches[1].clientY;
            return Math.hypot(dx, dy);
        }
        
        canvas.addEventListener('touchstart', (e) => {
            if (e.touches.length === 2) {
                e.preventDefault();
                initialPinchDistance = getPinchDistance(e.touches);
                initialZoomValue = zoom;
            }
        });
        
        window.addEventListener('touchmove', (e) => {
            if (e.touches.length === 2 && initialPinchDistance !== null && initialPinchDistance > 0) {
                e.preventDefault();
                const newDistance = getPinchDistance(e.touches);
                if (newDistance > 0) {
                    let scale = newDistance / initialPinchDistance;
                    let newZoom = initialZoomValue * scale;
                    newZoom = Math.min(5.2, Math.max(0.03, newZoom));
                    zoom = newZoom;
                }
            }
        }, { passive: false });
        
        window.addEventListener('touchend', (e) => {
            if (e.touches.length < 2) initialPinchDistance = null;
        });
        
        // Mouse wheel zoom (desktop + touchpad)
        window.addEventListener('wheel', (e) => {
            const deltaFactor = e.deltaY > 0 ? 0.92 : 1.08;
            let newZoom = zoom * deltaFactor;
            newZoom = Math.min(5.5, Math.max(0.03, newZoom));
            zoom = newZoom;
            e.preventDefault();
        }, { passive: false });
        
        // Double tap / double click RESET (zoom + pan to origin)
        let lastTapTimestamp = 0;
        canvas.addEventListener('touchend', (e) => {
            const now = Date.now();
            if (now - lastTapTimestamp < 280) {
                zoom = 1.0;
                offsetX = 0;
                offsetY = 0;
                e.preventDefault();
            }
            lastTapTimestamp = now;
        });
        
        canvas.addEventListener('dblclick', (e) => {
            zoom = 1.0;
            offsetX = 0;
            offsetY = 0;
            e.preventDefault();
        });
        
        // two-finger tap reset alternative (graceful)
        let twoFingerTapCount = 0;
        let resetTimeout = null;
        canvas.addEventListener('touchstart', (e) => {
            if (e.touches.length === 2 && !isDragging) {
                if (resetTimeout) clearTimeout(resetTimeout);
                twoFingerTapCount++;
                if (twoFingerTapCount >= 2) {
                    zoom = 1.0;
                    offsetX = 0;
                    offsetY = 0;
                    twoFingerTapCount = 0;
                    if (resetTimeout) clearTimeout(resetTimeout);
                } else {
                    resetTimeout = setTimeout(() => { twoFingerTapCount = 0; }, 280);
                }
            }
        });
        
        // resize handler
        window.addEventListener('resize', () => {
            resizeCanvas();
        });
        
        // ----- initialize universe -----
        function init() {
            resizeCanvas();
            generateStars();
            animate();
        }
        
        init();
    })();
</script>
</body>
</html>
