<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>EduVenn • Interactive Set Theory</title>
  <!-- Modern educational typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    :root {
      --primary: #3B3B98;
      --primary-soft: rgba(59, 59, 152, 0.18);
      --primary-glow: rgba(59, 59, 152, 0.25);
      --secondary: #4DD0E1;
      --secondary-soft: rgba(77, 208, 225, 0.18);
      --secondary-glow: rgba(77, 208, 225, 0.3);
      --intersection: rgba(59, 59, 152, 0.45);
      --bg: #F8FAFC;
      --card: #FFFFFF;
      --text: #1E293B;
      --muted: #64748B;
      --border-light: #E2E8F0;
      --shadow-sm: 0 10px 25px -5px rgba(0,0,0,0.03), 0 8px 10px -6px rgba(0,0,0,0.02);
      --radius-xl: 28px;
      --radius-pill: 999px;
    }

    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      color: var(--text);
    }

    /* Main educational workspace layout */
    .workspace {
      display: flex;
      height: 100vh;
      width: 100vw;
      position: relative;
    }

    /* Sidebar – clean educational panel */
    .sidebar {
      width: 340px;
      background: var(--card);
      border-right: 1px solid var(--border-light);
      display: flex;
      flex-direction: column;
      padding: 24px 20px;
      box-shadow: var(--shadow-sm);
      z-index: 10;
      transition: transform 0.3s ease;
      overflow-y: auto;
      gap: 20px;
    }

    .sidebar-header h2 {
      font-family: 'Poppins', sans-serif;
      font-weight: 600;
      font-size: 1.6rem;
      color: var(--primary);
      letter-spacing: -0.5px;
    }

    .sidebar-header p {
      color: var(--muted);
      font-size: 0.85rem;
      margin-top: 4px;
    }

    .set-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .set-card {
      background: #FFFFFF;
      border: 1px solid var(--border-light);
      border-radius: 18px;
      padding: 12px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      transition: all 0.2s ease;
    }

    .set-card.active-primary {
      border-left: 5px solid var(--primary);
      background: #F5F3FF;
    }

    .set-card.active-secondary {
      border-right: 5px solid var(--secondary);
      background: #F0FDFA;
    }

    .set-info {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .set-color-dot {
      width: 18px;
      height: 18px;
      border-radius: 50%;
    }

    .set-name {
      font-weight: 600;
      font-family: 'Poppins', sans-serif;
    }

    .set-actions {
      display: flex;
      gap: 6px;
    }

    .icon-btn {
      background: transparent;
      border: none;
      font-size: 1.1rem;
      padding: 6px 8px;
      border-radius: 12px;
      color: var(--muted);
      cursor: pointer;
      transition: 0.2s;
    }

    .icon-btn:hover {
      background: #F1F5F9;
      color: var(--primary);
    }

    .operation-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin: 8px 0;
    }

    .op-pill {
      background: white;
      border: 1px solid var(--border-light);
      border-radius: var(--radius-pill);
      padding: 14px 8px;
      font-weight: 500;
      font-size: 0.9rem;
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      cursor: pointer;
      transition: all 0.2s;
      font-family: 'Inter', sans-serif;
      height: 52px;
    }

    .op-pill.active {
      background: var(--primary);
      color: white;
      border-color: var(--primary);
      box-shadow: 0 8px 16px -6px rgba(59,59,152,0.3);
    }

    .explanation-box {
      background: #F8FAFC;
      border-radius: 20px;
      padding: 16px;
      border: 1px solid #E2E8F0;
      margin-top: 8px;
    }

    .explanation-title {
      font-family: 'Poppins', sans-serif;
      font-weight: 600;
      font-size: 1.2rem;
      color: var(--primary);
    }

    .explanation-desc {
      color: var(--muted);
      font-size: 0.9rem;
      margin-top: 6px;
    }

    .cardinality-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: white;
      border-radius: 16px;
      padding: 12px;
      margin-top: 6px;
    }

    /* Canvas area */
    .canvas-container {
      flex: 1;
      position: relative;
      background: var(--bg);
      overflow: hidden;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
      cursor: grab;
    }

    canvas:active {
      cursor: grabbing;
    }

    .floating-notation {
      position: absolute;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(255,255,255,0.9);
      backdrop-filter: blur(12px);
      padding: 12px 28px;
      border-radius: 60px;
      font-family: 'Poppins', sans-serif;
      font-weight: 600;
      font-size: 1.5rem;
      color: var(--primary);
      box-shadow: 0 10px 25px rgba(0,0,0,0.05);
      border: 1px solid rgba(59,59,152,0.1);
      pointer-events: none;
      white-space: nowrap;
      z-index: 20;
    }

    .mobile-toolbar {
      display: none;
      position: absolute;
      bottom: 20px;
      left: 20px;
      right: 20px;
      background: rgba(255,255,255,0.92);
      backdrop-filter: blur(12px);
      border-radius: 40px;
      padding: 10px 16px;
      justify-content: space-around;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
      border: 1px solid white;
      z-index: 25;
    }

    .mobile-toolbar .op-pill {
      height: 44px;
      padding: 8px 16px;
      font-size: 1rem;
      background: transparent;
      border: none;
    }

    .mobile-toolbar .op-pill.active {
      background: var(--primary);
      color: white;
    }

    @media (max-width: 800px) {
      .sidebar {
        position: absolute;
        left: 0;
        top: 0;
        bottom: 0;
        transform: translateX(-100%);
        width: 280px;
        z-index: 30;
        border-radius: 0 24px 24px 0;
        transition: transform 0.25s ease;
      }

      .sidebar.open {
        transform: translateX(0);
      }

      .mobile-toolbar {
        display: flex;
      }

      .floating-notation {
        bottom: 100px;
        font-size: 1.2rem;
        padding: 8px 22px;
      }
    }
  </style>
</head>
<body>
<div class="workspace">
  <!-- Educational Sidebar -->
  <div class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <h2>📐 Set Explorer</h2>
      <p>Interactive Venn learning</p>
    </div>
    <div class="set-list" id="circleListContainer"></div>
    <div style="margin-top: 6px;">
      <div style="display: flex; gap: 8px;">
        <input type="text" id="newSetName" placeholder="Set name" maxlength="3" style="flex:1; padding: 12px; border:1px solid #E2E8F0; border-radius: 20px; font-family: Inter;">
        <button id="addSetBtn" style="background: var(--primary); color:white; border:none; border-radius: 30px; padding: 0 20px; font-weight:600;">+ Add</button>
      </div>
    </div>
    <div class="operation-grid" id="operationGrid"></div>
    <div class="explanation-box" id="explanationBox">
      <div class="explanation-title" id="explainTitle">∪ Union</div>
      <div class="explanation-desc" id="explainDesc">All elements in A or B.</div>
    </div>
    <div class="cardinality-row" id="cardinalityDisplay">
      <span>|A| = <strong id="cardA">0</strong></span>
      <span>|B| = <strong id="cardB">0</strong></span>
      <span>|A∩B| = <strong id="cardIntersect">0</strong></span>
    </div>
    <button id="toggleSidebarMobile" style="display:none; margin-top:auto; background:#F1F5F9; border:none; padding:12px; border-radius:20px;">Close panel</button>
  </div>

  <!-- Canvas mathematical workspace -->
  <div class="canvas-container">
    <canvas id="vennCanvas"></canvas>
    <div class="floating-notation" id="liveNotation">A ∪ B</div>
    <div class="mobile-toolbar" id="mobileToolbar">
      <button class="op-pill mobile-op" data-op="union">∪</button>
      <button class="op-pill mobile-op" data-op="intersect">∩</button>
      <button class="op-pill mobile-op" data-op="diff">−</button>
      <button class="op-pill mobile-op" data-op="symm">Δ</button>
      <button class="op-pill mobile-op" data-op="comp">∁</button>
    </div>
  </div>
</div>

<script>
  (function() {
    const canvas = document.getElementById('vennCanvas');
    const ctx = canvas.getContext('2d');

    // ---- State ----
    let width, height;
    let circles = [];
    let nextId = 1;
    let selectedA = null;
    let selectedB = null;
    let currentOp = 'union'; // union, intersect, diff, symm, comp
    let dragCircle = null;
    let isDragging = false;

    // Colors following design system
    const PRIMARY = '#3B3B98';
    const SECONDARY = '#4DD0E1';
    const PRIMARY_FILL = 'rgba(59, 59, 152, 0.18)';
    const SECONDARY_FILL = 'rgba(77, 208, 225, 0.18)';
    const INTERSECTION_FILL = 'rgba(59, 59, 152, 0.45)';

    // ---- Circle management ----
    function createCircle(name, x, y, r = 130) {
      const isFirst = circles.length === 0;
      return {
        id: nextId++,
        name: name.toUpperCase().substring(0,3),
        x, y, r,
        color: isFirst ? 'primary' : 'secondary', // alternate for clarity
        fill: isFirst ? PRIMARY_FILL : SECONDARY_FILL,
        stroke: isFirst ? PRIMARY : SECONDARY
      };
    }

    function addCircle(name, x, y) {
      const newCircle = createCircle(name, x, y);
      circles.push(newCircle);
      if (!selectedA) selectedA = newCircle;
      else if (!selectedB && newCircle.id !== selectedA.id) selectedB = newCircle;
      renderSidebar();
      recalculateAndUpdate();
    }

    function deleteCircle(id) {
      circles = circles.filter(c => c.id !== id);
      if (selectedA && selectedA.id === id) selectedA = circles[0] || null;
      if (selectedB && selectedB.id === id) selectedB = null;
      if (selectedA && selectedB && selectedA.id === selectedB.id) selectedB = null;
      renderSidebar();
      recalculateAndUpdate();
    }

    function selectAsA(circle) {
      if (!circle) return;
      selectedA = circle;
      if (selectedB && selectedB.id === circle.id) selectedB = null;
      renderSidebar();
      recalculateAndUpdate();
    }

    function selectAsB(circle) {
      if (!circle || (selectedA && circle.id === selectedA.id)) return;
      selectedB = circle;
      renderSidebar();
      recalculateAndUpdate();
    }

    // ---- Geometric calculations ----
    function computeIntersectionArea(c1, c2) {
      const dx = c1.x - c2.x;
      const dy = c1.y - c2.y;
      const d = Math.hypot(dx, dy);
      const r1 = c1.r, r2 = c2.r;
      if (d >= r1 + r2) return 0;
      if (d <= Math.abs(r1 - r2)) return Math.PI * Math.min(r1, r2) ** 2;
      const part1 = r1*r1 * Math.acos((d*d + r1*r1 - r2*r2)/(2*d*r1));
      const part2 = r2*r2 * Math.acos((d*d + r2*r2 - r1*r1)/(2*d*r2));
      const part3 = 0.5 * Math.sqrt((-d+r1+r2)*(d+r1-r2)*(d-r1+r2)*(d+r1+r2));
      return part1 + part2 - part3;
    }

    function recalculateAndUpdate() {
      updateCardinalityUI();
      updateExplanation();
      updateNotation();
    }

    function updateCardinalityUI() {
      const cardA = document.getElementById('cardA');
      const cardB = document.getElementById('cardB');
      const cardIntersect = document.getElementById('cardIntersect');
      if (!selectedA) {
        cardA.innerText = '0'; cardB.innerText = '0'; cardIntersect.innerText = '0';
        return;
      }
      const areaA = Math.PI * selectedA.r * selectedA.r;
      cardA.innerText = Math.floor(areaA / 100);
      if (selectedB) {
        const areaB = Math.PI * selectedB.r * selectedB.r;
        cardB.innerText = Math.floor(areaB / 100);
        const interArea = computeIntersectionArea(selectedA, selectedB);
        cardIntersect.innerText = Math.floor(interArea / 100);
      } else {
        cardB.innerText = '0';
        cardIntersect.innerText = '0';
      }
    }

    function updateExplanation() {
      const titleEl = document.getElementById('explainTitle');
      const descEl = document.getElementById('explainDesc');
      const explanations = {
        union: { title: 'A ∪ B', desc: 'All elements belonging to either set A or set B.' },
        intersect: { title: 'A ∩ B', desc: 'Elements common to both sets.' },
        diff: { title: 'A − B', desc: 'Elements inside A but not in B.' },
        symm: { title: 'A Δ B', desc: 'Elements in A or B but not both.' },
        comp: { title: "A' (Complement)", desc: 'Everything outside set A.' }
      };
      const exp = explanations[currentOp] || explanations.union;
      titleEl.innerText = exp.title;
      descEl.innerText = exp.desc;
    }

    function updateNotation() {
      const notationEl = document.getElementById('liveNotation');
      if (!selectedA) {
        notationEl.innerText = 'Select a set';
        return;
      }
      if (currentOp === 'comp') {
        notationEl.innerText = `${selectedA.name}'`;
      } else if (selectedB) {
        const symbols = { union: '∪', intersect: '∩', diff: '−', symm: 'Δ' };
        notationEl.innerText = `${selectedA.name} ${symbols[currentOp]} ${selectedB.name}`;
      } else {
        notationEl.innerText = `${selectedA.name} (need B)`;
      }
    }

    // ---- Canvas drawing with educational style ----
    function drawGrid() {
      ctx.strokeStyle = '#CBD5E1';
      ctx.lineWidth = 0.6;
      const step = 45;
      ctx.beginPath();
      for (let x = step; x < width; x += step) {
        ctx.moveTo(x, 0);
        ctx.lineTo(x, height);
      }
      for (let y = step; y < height; y += step) {
        ctx.moveTo(0, y);
        ctx.lineTo(width, y);
      }
      ctx.strokeStyle = 'rgba(0,0,0,0.04)';
      ctx.stroke();
    }

    function drawCircle(c, isA, isB) {
      ctx.beginPath();
      ctx.arc(c.x, c.y, c.r, 0, 2 * Math.PI);
      ctx.fillStyle = c.fill;
      ctx.fill();
      
      ctx.strokeStyle = isA ? PRIMARY : (isB ? SECONDARY : c.stroke);
      ctx.lineWidth = (isA || isB) ? 3.5 : 2.5;
      ctx.stroke();

      // Soft glow for selected
      if (isA || isB) {
        ctx.shadowColor = isA ? PRIMARY : SECONDARY;
        ctx.shadowBlur = 14;
        ctx.strokeStyle = isA ? PRIMARY : SECONDARY;
        ctx.lineWidth = 2;
        ctx.stroke();
        ctx.shadowBlur = 0;
      }

      // Label
      ctx.font = 'bold 22px "Poppins", sans-serif';
      ctx.fillStyle = '#1E293B';
      ctx.fillText(c.name, c.x - 12, c.y - c.r * 0.65);
    }

    function drawOperationHighlight() {
      if (!selectedA) return;
      const A = selectedA, B = selectedB;
      ctx.save();
      
      if (currentOp === 'union' && B) {
        ctx.fillStyle = 'rgba(59,59,152,0.25)';
        ctx.beginPath(); ctx.arc(A.x,A.y,A.r,0,Math.PI*2); ctx.fill();
        ctx.fillStyle = 'rgba(77,208,225,0.25)';
        ctx.beginPath(); ctx.arc(B.x,B.y,B.r,0,Math.PI*2); ctx.fill();
      } else if (currentOp === 'intersect' && B) {
        ctx.save();
        ctx.beginPath(); ctx.arc(A.x,A.y,A.r,0,Math.PI*2); ctx.clip();
        ctx.beginPath(); ctx.arc(B.x,B.y,B.r,0,Math.PI*2); ctx.clip();
        ctx.fillStyle = INTERSECTION_FILL;
        ctx.fillRect(0,0,width,height);
        ctx.restore();
      } else if (currentOp === 'diff' && B) {
        ctx.save();
        ctx.beginPath(); ctx.arc(A.x,A.y,A.r,0,Math.PI*2); ctx.clip();
        ctx.globalCompositeOperation = 'destination-out';
        ctx.beginPath(); ctx.arc(B.x,B.y,B.r,0,Math.PI*2); ctx.fill();
        ctx.globalCompositeOperation = 'source-over';
        ctx.fillStyle = 'rgba(59,59,152,0.4)';
        ctx.fillRect(0,0,width,height);
        ctx.restore();
      } else if (currentOp === 'symm' && B) {
        ctx.fillStyle = 'rgba(59,59,152,0.25)';
        ctx.beginPath(); ctx.arc(A.x,A.y,A.r,0,Math.PI*2); ctx.fill();
        ctx.fillStyle = 'rgba(77,208,225,0.25)';
        ctx.beginPath(); ctx.arc(B.x,B.y,B.r,0,Math.PI*2); ctx.fill();
        ctx.globalCompositeOperation = 'destination-out';
        ctx.beginPath(); ctx.arc(A.x,A.y,A.r,0,Math.PI*2); ctx.clip();
        ctx.beginPath(); ctx.arc(B.x,B.y,B.r,0,Math.PI*2); ctx.fill();
        ctx.globalCompositeOperation = 'source-over';
      } else if (currentOp === 'comp') {
        ctx.fillStyle = 'rgba(0,0,0,0.06)';
        ctx.fillRect(0,0,width,height);
        ctx.globalCompositeOperation = 'destination-out';
        ctx.beginPath(); ctx.arc(A.x,A.y,A.r,0,Math.PI*2); ctx.fill();
        ctx.globalCompositeOperation = 'source-over';
      }
      ctx.restore();
    }

    function drawCanvas() {
      ctx.clearRect(0, 0, width, height);
      drawGrid();
      
      circles.forEach(c => {
        const isA = selectedA?.id === c.id;
        const isB = selectedB?.id === c.id;
        drawCircle(c, isA, isB);
      });

      drawOperationHighlight();

      if (selectedA && selectedB && currentOp !== 'comp') {
        ctx.beginPath();
        ctx.moveTo(selectedA.x, selectedA.y);
        ctx.lineTo(selectedB.x, selectedB.y);
        ctx.strokeStyle = '#94A3B8';
        ctx.lineWidth = 1.2;
        ctx.setLineDash([6, 6]);
        ctx.stroke();
        ctx.setLineDash([]);
      }
    }

    function animate() {
      drawCanvas();
      requestAnimationFrame(animate);
    }

    // ---- Interaction ----
    function getCanvasCoords(e) {
      const rect = canvas.getBoundingClientRect();
      const scaleX = canvas.width / rect.width;
      const scaleY = canvas.height / rect.height;
      let clientX, clientY;
      if (e.touches) {
        clientX = e.touches[0].clientX;
        clientY = e.touches[0].clientY;
      } else {
        clientX = e.clientX;
        clientY = e.clientY;
      }
      return {
        x: (clientX - rect.left) * scaleX,
        y: (clientY - rect.top) * scaleY
      };
    }

    function findCircle(x, y) {
      for (let i = circles.length-1; i>=0; i--) {
        if (Math.hypot(x - circles[i].x, y - circles[i].y) < circles[i].r) return circles[i];
      }
      return null;
    }

    function onPointerDown(e) {
      e.preventDefault();
      const {x, y} = getCanvasCoords(e);
      const circle = findCircle(x, y);
      if (circle) {
        if (e.shiftKey || (e.touches && e.touches.length > 1)) {
          selectAsB(circle);
        } else {
          selectAsA(circle);
        }
        dragCircle = circle;
        isDragging = true;
        canvas.style.cursor = 'grabbing';
      }
    }

    function onPointerMove(e) {
      if (!isDragging || !dragCircle) return;
      e.preventDefault();
      const {x, y} = getCanvasCoords(e);
      dragCircle.x = Math.min(Math.max(x, 40 + dragCircle.r), width - 40 - dragCircle.r);
      dragCircle.y = Math.min(Math.max(y, 40 + dragCircle.r), height - 40 - dragCircle.r);
      recalculateAndUpdate();
    }

    function onPointerUp() {
      isDragging = false;
      dragCircle = null;
      canvas.style.cursor = 'grab';
    }

    function resizeCanvas() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
      circles.forEach(c => {
        c.x = Math.min(Math.max(c.x, 60), width-60);
        c.y = Math.min(Math.max(c.y, 60), height-60);
      });
    }

    // ---- UI rendering ----
    function renderSidebar() {
      const container = document.getElementById('circleListContainer');
      container.innerHTML = '';
      circles.forEach(c => {
        const isA = selectedA?.id === c.id;
        const isB = selectedB?.id === c.id;
        const div = document.createElement('div');
        div.className = `set-card ${isA ? 'active-primary' : ''} ${isB ? 'active-secondary' : ''}`;
        div.innerHTML = `
          <div class="set-info">
            <div class="set-color-dot" style="background:${c.stroke};"></div>
            <span class="set-name">${c.name}</span>
          </div>
          <div class="set-actions">
            <button class="icon-btn sel-a" data-id="${c.id}">⭐</button>
            <button class="icon-btn sel-b" data-id="${c.id}">🔹</button>
            <button class="icon-btn del" data-id="${c.id}">🗑️</button>
          </div>
        `;
        container.appendChild(div);
      });

      document.querySelectorAll('.sel-a').forEach(b => b.addEventListener('click', (e) => {
        const id = parseInt(e.currentTarget.dataset.id);
        selectAsA(circles.find(c=>c.id===id));
      }));
      document.querySelectorAll('.sel-b').forEach(b => b.addEventListener('click', (e) => {
        const id = parseInt(e.currentTarget.dataset.id);
        selectAsB(circles.find(c=>c.id===id));
      }));
      document.querySelectorAll('.del').forEach(b => b.addEventListener('click', (e) => {
        deleteCircle(parseInt(e.currentTarget.dataset.id));
      }));

      // Update operation buttons active state
      document.querySelectorAll('.op-pill').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.op === currentOp);
      });
    }

    function setupOperations() {
      const ops = ['union', 'intersect', 'diff', 'symm', 'comp'];
      const grid = document.getElementById('operationGrid');
      grid.innerHTML = '';
      ops.forEach(op => {
        const btn = document.createElement('button');
        btn.className = `op-pill ${op === currentOp ? 'active' : ''}`;
        btn.dataset.op = op;
        btn.innerText = {union:'∪ Union', intersect:'∩ Intersect', diff:'− Diff', symm:'Δ Sym', comp:'∁ Comp'}[op];
        btn.addEventListener('click', () => {
          currentOp = op;
          renderSidebar();
          recalculateAndUpdate();
        });
        grid.appendChild(btn);
      });

      document.querySelectorAll('.mobile-op').forEach(btn => {
        btn.addEventListener('click', () => {
          currentOp = btn.dataset.op;
          renderSidebar();
          recalculateAndUpdate();
        });
      });
    }

    // Mobile sidebar toggle
    const sidebar = document.getElementById('sidebar');
    document.getElementById('toggleSidebarMobile').addEventListener('click', () => {
      sidebar.classList.toggle('open');
    });
    // Open sidebar on canvas tap if mobile (simple toggle)
    canvas.addEventListener('dblclick', () => {
      if (window.innerWidth <= 800) sidebar.classList.toggle('open');
    });

    window.addEventListener('resize', () => {
      resizeCanvas();
      recalculateAndUpdate();
    });

    // Event listeners
    canvas.addEventListener('mousedown', onPointerDown);
    window.addEventListener('mousemove', (e) => { if (isDragging) onPointerMove(e); });
    window.addEventListener('mouseup', onPointerUp);
    canvas.addEventListener('touchstart', onPointerDown, {passive: false});
    window.addEventListener('touchmove', (e) => { if(isDragging) onPointerMove(e); }, {passive: false});
    window.addEventListener('touchend', onPointerUp);
    window.addEventListener('touchcancel', onPointerUp);

    document.getElementById('addSetBtn').addEventListener('click', () => {
      const input = document.getElementById('newSetName');
      let name = input.value.trim() || String.fromCharCode(65 + circles.length);
      const x = width/2 + (circles.length * 30 - 50);
      const y = height/2 + (circles.length%2===0 ? -50 : 50);
      addCircle(name, x, y);
      input.value = '';
    });

    // Init
    function init() {
      resizeCanvas();
      circles = [];
      nextId = 1;
      addCircle('A', width/2 - 110, height/2, 135);
      addCircle('B', width/2 + 100, height/2, 135);
      selectedA = circles[0];
      selectedB = circles[1];
      currentOp = 'union';
      setupOperations();
      renderSidebar();
      recalculateAndUpdate();
      animate();
    }

    init();
  })();
</script>
</body>
</html>
