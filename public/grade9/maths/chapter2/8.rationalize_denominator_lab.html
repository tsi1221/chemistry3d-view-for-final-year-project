<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Rationalize Visual Lab</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

:root{
    --blue:#0057ff;
    --cyan:#00d4ff;
    --dark:#071120;
    --green:#22c55e;
    --red:#ff4d6d;
    --white:#ffffff;
}

body{
    font-family:'Inter',sans-serif;
    min-height:100vh;
    background:
    radial-gradient(circle at top left,#cfe8ff,#edf7ff 50%,#ffffff);
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
    overflow:hidden;
}

body::before{
    content:'';
    position:fixed;
    inset:0;
    background-image:
    linear-gradient(rgba(0,0,0,.03) 1px,transparent 1px),
    linear-gradient(90deg,rgba(0,0,0,.03) 1px,transparent 1px);
    background-size:40px 40px;
    z-index:-1;
}

.container{
    width:100%;
    max-width:1350px;
    min-height:92vh;
    border-radius:35px;
    overflow:hidden;
    background:rgba(255,255,255,.7);
    backdrop-filter:blur(14px);
    box-shadow:
    0 25px 70px rgba(0,87,255,.12),
    inset 0 1px 0 rgba(255,255,255,.6);
    display:grid;
    grid-template-columns:1fr 320px;
}

@media(max-width:980px){
    .container{
        grid-template-columns:1fr;
    }
}

.visual-area{
    position:relative;
    padding:30px;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    overflow:hidden;
}

.top-ui{
    width:100%;
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:20px;
    gap:20px;
    flex-wrap:wrap;
}

.main-fraction{
    font-size:clamp(2.5rem,6vw,5rem);
    font-weight:800;
    color:var(--blue);
    transition:.5s;
}

.status{
    background:white;
    border-radius:100px;
    padding:14px 24px;
    box-shadow:0 10px 25px rgba(0,0,0,.08);
    font-weight:700;
    color:var(--blue);
}

.canvas-box{
    width:100%;
    flex:1;
    border-radius:35px;
    overflow:hidden;
    position:relative;
    background:
    linear-gradient(135deg,#ffffff,#f7fbff);
    border:1px solid #dbeafe;
    box-shadow:0 15px 45px rgba(0,0,0,.05);
}

canvas{
    width:100%;
    height:100%;
    display:block;
}

.side-panel{
    background:
    linear-gradient(180deg,#0057ff,#0038a8);
    padding:25px;
    display:flex;
    flex-direction:column;
    justify-content:center;
    gap:25px;
    position:relative;
    overflow:hidden;
}

.side-panel::before{
    content:'';
    position:absolute;
    width:300px;
    height:300px;
    background:rgba(255,255,255,.08);
    border-radius:50%;
    top:-120px;
    right:-120px;
}

.control-card{
    background:rgba(255,255,255,.12);
    backdrop-filter:blur(10px);
    border:1px solid rgba(255,255,255,.2);
    border-radius:30px;
    padding:25px;
    color:white;
    position:relative;
    z-index:2;
}

.control-title{
    font-size:.95rem;
    opacity:.8;
    margin-bottom:18px;
    font-weight:700;
}

.slider-value{
    text-align:center;
    font-size:2.2rem;
    font-weight:800;
    margin-top:18px;
}

input[type=range]{
    width:100%;
    cursor:pointer;
    accent-color:white;
}

.action-btn{
    border:none;
    background:white;
    color:var(--blue);
    padding:20px;
    border-radius:22px;
    font-size:1rem;
    font-weight:800;
    cursor:pointer;
    transition:.4s;
    box-shadow:0 15px 30px rgba(0,0,0,.12);
}

.action-btn:hover{
    transform:translateY(-5px) scale(1.02);
}

.mini-equation{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:15px;
    flex-wrap:wrap;
}

.eq-box{
    background:rgba(255,255,255,.14);
    border:1px solid rgba(255,255,255,.15);
    padding:14px 18px;
    border-radius:18px;
    font-size:1.1rem;
    font-weight:700;
}

.popup{
    position:fixed;
    top:25px;
    left:50%;
    transform:translateX(-50%) translateY(-120px);
    background:linear-gradient(135deg,#0057ff,#00d4ff);
    color:white;
    padding:18px 34px;
    border-radius:100px;
    font-weight:800;
    transition:.5s;
    z-index:999;
    box-shadow:0 15px 35px rgba(0,0,0,.18);
}

.popup.show{
    transform:translateX(-50%) translateY(0);
}

.glow{
    position:absolute;
    width:450px;
    height:450px;
    border-radius:50%;
    background:radial-gradient(circle,rgba(0,212,255,.18),transparent 70%);
    filter:blur(10px);
    animation:float 5s ease-in-out infinite;
}

@keyframes float{
    0%,100%{
        transform:translateY(0px);
    }
    50%{
        transform:translateY(-30px);
    }
}

</style>
</head>

<body>

<div class="popup" id="popup">
    Rationalized
</div>

<div class="container">

    <section class="visual-area">

        <div class="glow"></div>

        <div class="top-ui">

            <div class="main-fraction" id="fractionUI">
                1 / √2
            </div>

            <div class="status" id="status">
                Radical
            </div>

        </div>

        <div class="canvas-box">
            <canvas id="canvas" width="900" height="600"></canvas>
        </div>

    </section>

    <aside class="side-panel">

        <div class="control-card">

            <div class="control-title">
                ROOT VALUE
            </div>

            <input
            type="range"
            min="2"
            max="20"
            value="2"
            step="1"
            id="slider">

            <div class="slider-value" id="valueLabel">
                √2
            </div>

        </div>

        <button class="action-btn" onclick="flipFraction()">
            FLIP & RATIONALIZE
        </button>

        <div class="control-card">

            <div class="mini-equation">

                <div class="eq-box" id="eq1">
                    1 / √2
                </div>

                <div style="font-size:1.4rem;">
                    ×
                </div>

                <div class="eq-box" id="eq2">
                    √2 / √2
                </div>

            </div>

        </div>

    </aside>

</div>

<script>

const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

const slider = document.getElementById('slider');

const fractionUI = document.getElementById('fractionUI');
const valueLabel = document.getElementById('valueLabel');
const popup = document.getElementById('popup');
const statusText = document.getElementById('status');

let x = 2;
let rationalized = false;

let particles = [];

function createParticles(cx,cy,color){

    for(let i=0;i<30;i++){

        particles.push({

            x:cx,
            y:cy,
            dx:(Math.random()-0.5)*8,
            dy:(Math.random()-0.5)*8,
            radius:Math.random()*6+2,
            alpha:1,
            color

        });

    }

}

function drawParticles(){

    particles.forEach((p,index)=>{

        p.x += p.dx;
        p.y += p.dy;
        p.alpha -= 0.02;

        ctx.globalAlpha = p.alpha;

        ctx.beginPath();
        ctx.arc(p.x,p.y,p.radius,0,Math.PI*2);

        ctx.fillStyle = p.color;
        ctx.fill();

        if(p.alpha <= 0){
            particles.splice(index,1);
        }

    });

    ctx.globalAlpha = 1;

}

function draw(){

    ctx.clearRect(0,0,canvas.width,canvas.height);

    const cx = canvas.width/2;
    const cy = canvas.height/2;

    // background glow
    const gradient = ctx.createRadialGradient(
        cx,cy,50,
        cx,cy,280
    );

    gradient.addColorStop(0,'rgba(0,212,255,.18)');
    gradient.addColorStop(1,'rgba(255,255,255,0)');

    ctx.fillStyle = gradient;
    ctx.fillRect(0,0,canvas.width,canvas.height);

    // fraction bar
    ctx.lineWidth = 10;
    ctx.strokeStyle = '#0f172a';
    ctx.lineCap = 'round';

    ctx.beginPath();
    ctx.moveTo(cx-140,cy);
    ctx.lineTo(cx+140,cy);
    ctx.stroke();

    // numerator
    ctx.font = 'bold 80px Inter';
    ctx.textAlign = 'center';

    ctx.fillStyle = rationalized
    ? '#00d4ff'
    : '#0057ff';

    ctx.fillText(
        rationalized ? `√${x}` : '1',
        cx,
        cy-90
    );

    // denominator block

    ctx.save();

    const color = rationalized
    ? '#22c55e'
    : '#ff4d6d';

    ctx.shadowColor = color;
    ctx.shadowBlur = 30;

    ctx.fillStyle = rationalized
    ? 'rgba(34,197,94,.12)'
    : 'rgba(255,77,109,.12)';

    ctx.strokeStyle = color;

    ctx.lineWidth = 6;

    ctx.beginPath();

    ctx.roundRect(
        cx-100,
        cy+40,
        200,
        120,
        28
    );

    ctx.fill();
    ctx.stroke();

    ctx.restore();

    // denominator text
    ctx.font = 'bold 70px Inter';
    ctx.fillStyle = color;

    ctx.fillText(
        rationalized ? `${x}` : `√${x}`,
        cx,
        cy+120
    );

    // animated rings
    for(let i=0;i<3;i++){

        ctx.beginPath();

        ctx.strokeStyle =
        `rgba(0,87,255,${0.15 - i*0.04})`;

        ctx.lineWidth = 2;

        ctx.arc(
            cx,
            cy,
            180 + i*35 + Math.sin(Date.now()/700)*10,
            0,
            Math.PI*2
        );

        ctx.stroke();

    }

    drawParticles();

    requestAnimationFrame(draw);

}

function updateUI(){

    fractionUI.innerHTML =
    rationalized
    ? `√${x} / ${x}`
    : `1 / √${x}`;

    valueLabel.innerHTML = `√${x}`;

    document.getElementById('eq1').innerHTML =
    `1 / √${x}`;

    document.getElementById('eq2').innerHTML =
    `√${x} / √${x}`;

    statusText.innerHTML =
    rationalized
    ? 'Rationalized'
    : 'Radical';

}

function flipFraction(){

    rationalized = !rationalized;

    popup.classList.add('show');

    setTimeout(()=>{
        popup.classList.remove('show');
    },1800);

    createParticles(
        canvas.width/2,
        canvas.height/2,
        rationalized ? '#22c55e' : '#ff4d6d'
    );

    updateUI();

}

slider.addEventListener('input',(e)=>{

    x = e.target.value;

    rationalized = false;

    updateUI();

});

updateUI();
draw();

</script>

</body>
</html>
