<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Factor Tree GCF & LCM</title>
    <style>
        :root {
            --bg: #f8fafc;
            --surface: #ffffff;
            --surface-secondary: #f1f5f9;
            --text-primary: #0f172a;
            --text-secondary: #475569;
            --text-tertiary: #94a3b8;
            --accent: #3b82f6;
            --accent-soft: #dbeafe;
            --gold: #f59e0b;
            --gold-soft: #fef3c7;
            --border: #e2e8f0;
            --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.05), 0 2px 4px -2px rgb(0 0 0 / 0.05);
            --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.05), 0 4px 6px -4px rgb(0 0 0 / 0.05);
            --radius: 16px;
            --radius-sm: 10px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            color: var(--text-primary);
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
        }

        #canvas {
            display: block;
            touch-action: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        .ui-top {
            position: fixed;
            top: 24px;
            left: 24px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            pointer-events: auto;
            z-index: 10;
            max-width: calc(100vw - 48px);
        }

        .panel {
            background: var(--surface);
            box-shadow: var(--shadow-lg);
            border: 1px solid var(--border);
            padding: 20px;
            border-radius: var(--radius);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            background: rgba(255, 255, 255, 0.95);
        }

        .label {
            font-size: 0.7rem;
            font-weight: 600;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            color: var(--text-tertiary);
            margin-bottom: 8px;
        }

        .input-row {
            display: flex;
            gap: 12px;
            margin-top: 8px;
            flex-wrap: wrap;
        }

        input {
            width: 90px;
            min-width: 70px;
            flex: 1;
            background: var(--surface-secondary);
            border: 1.5px solid var(--border);
            border-radius: var(--radius-sm);
            color: var(--text-primary);
            padding: 10px;
            text-align: center;
            font-family: 'SF Mono', 'Menlo', monospace;
            font-size: 1.2rem;
            font-weight: 500;
            outline: none;
            transition: border-color 0.15s, box-shadow 0.15s;
            -webkit-appearance: none;
            appearance: none;
            min-height: 44px;
        }

        input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-soft);
        }

        .mode-tabs {
            display: flex;
            gap: 8px;
            margin-top: 16px;
            flex-wrap: wrap;
        }

        .tab {
            flex: 1;
            min-width: fit-content;
            background: var(--surface-secondary);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            color: var(--text-secondary);
            padding: 10px 16px;
            cursor: pointer;
            font-size: 0.75rem;
            text-transform: uppercase;
            font-weight: 600;
            letter-spacing: 0.5px;
            text-align: center;
            transition: all 0.15s;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
            min-height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .tab:hover {
            background: var(--surface);
            border-color: var(--accent);
            color: var(--accent);
        }

        .tab.active {
            background: var(--accent);
            border-color: var(--accent);
            color: white;
            box-shadow: 0 2px 8px rgba(59, 130, 246, 0.25);
        }

        .logic-view {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 800px;
            text-align: center;
            pointer-events: auto;
            background: var(--surface);
            box-shadow: var(--shadow-lg);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 24px;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            background: rgba(255, 255, 255, 0.95);
            z-index: 10;
        }

        .logic-title {
            font-size: 0.7rem;
            font-weight: 600;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            color: var(--text-tertiary);
            margin-bottom: 20px;
        }

        .factor-section {
            margin-bottom: 16px;
        }

        .section-label {
            color: var(--text-tertiary);
            font-size: 0.7rem;
            font-weight: 500;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }

        .factor-row {
            display: flex;
            justify-content: center;
            gap: 10px;
            font-family: 'SF Mono', 'Menlo', monospace;
            font-size: 1.3rem;
            flex-wrap: wrap;
        }

        .factor-pill {
            padding: 8px 16px;
            border: 1.5px solid var(--border);
            border-radius: 40px;
            background: var(--surface-secondary);
            color: var(--text-secondary);
            font-weight: 500;
            transition: all 0.2s;
            white-space: nowrap;
        }

        .factor-pill.highlight {
            background: var(--gold);
            border-color: var(--gold);
            color: white;
            box-shadow: 0 2px 8px rgba(245, 158, 11, 0.25);
        }

        .divider {
            border: 0;
            border-top: 1.5px solid var(--border);
            margin: 20px 0;
        }

        .result-math {
            color: var(--text-primary);
            font-weight: 600;
            font-size: 1.2rem;
            font-family: 'SF Mono', 'Menlo', monospace;
            word-break: break-word;
        }

        .result-math span {
            color: var(--gold);
        }

        /* Hamburger Menu Button */
        .hamburger-btn {
            display: none;
            position: fixed;
            top: 24px;
            right: 24px;
            width: 44px;
            height: 44px;
            min-width: 44px;
            min-height: 44px;
            border-radius: 14px;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid var(--border);
            color: var(--text-primary);
            font-size: 1.5rem;
            cursor: pointer;
            z-index: 100;
            pointer-events: auto;
            box-shadow: var(--shadow-lg);
            align-items: center;
            justify-content: center;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }

        .hamburger-btn:hover {
            background: rgba(255, 255, 255, 1);
        }

        .hamburger-btn .icon {
            display: block;
            width: 20px;
            height: 2px;
            background: var(--text-primary);
            position: relative;
            transition: all 0.3s;
            border-radius: 1px;
        }

        .hamburger-btn .icon::before,
        .hamburger-btn .icon::after {
            content: '';
            display: block;
            width: 20px;
            height: 2px;
            background: var(--text-primary);
            position: absolute;
            left: 0;
            transition: all 0.3s;
            border-radius: 1px;
        }

        .hamburger-btn .icon::before {
            top: -6px;
        }

        .hamburger-btn .icon::after {
            top: 6px;
        }

        .hamburger-btn.open .icon {
            background: transparent;
        }

        .hamburger-btn.open .icon::before {
            top: 0;
            transform: rotate(45deg);
        }

        .hamburger-btn.open .icon::after {
            top: 0;
            transform: rotate(-45deg);
        }

        /* Mobile Menu Overlay */
        .mobile-menu-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.2);
            z-index: 90;
            pointer-events: auto;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .mobile-menu-overlay.active {
            opacity: 1;
        }

        /* Mobile Menu Panel */
        .mobile-menu {
            display: none;
            position: fixed;
            top: 0;
            right: -100%;
            width: 340px;
            max-width: 90vw;
            height: 100vh;
            height: 100dvh;
            background: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            z-index: 95;
            pointer-events: auto;
            box-shadow: -4px 0 30px rgba(0, 0, 0, 0.08);
            transition: right 0.3s ease;
            overflow-y: auto;
            padding: 20px;
            -webkit-overflow-scrolling: touch;
        }

        .mobile-menu.open {
            right: 0;
        }

        .mobile-menu-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--border);
        }

        .mobile-menu-title {
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--accent);
            letter-spacing: -0.3px;
        }

        .mobile-menu-close {
            width: 36px;
            height: 36px;
            min-width: 36px;
            min-height: 36px;
            border-radius: 10px;
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-primary);
            font-size: 1.2rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
            transition: all 0.2s;
        }

        .mobile-menu-close:hover {
            background: rgba(0, 0, 0, 0.03);
        }

        .mobile-menu-section {
            margin-bottom: 18px;
        }

        .mobile-menu-label {
            font-size: 0.65rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: var(--text-tertiary);
            margin-bottom: 8px;
        }

        .mobile-menu .input-row {
            margin-bottom: 12px;
        }

        .mobile-menu .mode-tabs {
            margin-bottom: 16px;
        }

        .mobile-menu .factor-section {
            margin-bottom: 12px;
        }

        .mobile-menu .section-label {
            font-size: 0.6rem;
        }

        .mobile-menu .factor-row {
            font-size: 1.1rem;
            gap: 8px;
        }

        .mobile-menu .factor-pill {
            padding: 6px 12px;
            font-size: 0.95rem;
        }

        .mobile-menu .divider {
            margin: 16px 0;
        }

        .mobile-menu .result-math {
            font-size: 1.1rem;
        }

        .mobile-menu .logic-title {
            font-size: 0.65rem;
            margin-bottom: 16px;
        }

        .mobile-menu input {
            width: 80px;
            font-size: 1.1rem;
            padding: 8px;
            min-height: 40px;
        }

        .mobile-menu .tab {
            font-size: 0.7rem;
            padding: 8px 12px;
            min-height: 40px;
        }

        /* Responsive Breakpoints */
        @media (max-width: 768px) {
            .hamburger-btn {
                display: flex;
            }

            .mobile-menu-overlay {
                display: block;
            }

            .mobile-menu {
                display: block;
            }

            .ui-top {
                display: none;
            }

            .logic-view {
                display: none;
            }

            .ui-top {
                left: 12px;
                right: 12px;
                max-width: calc(100vw - 24px);
            }

            .panel {
                padding: 16px;
                border-radius: 14px;
            }

            .logic-view {
                padding: 20px 16px;
                width: calc(100% - 24px);
                border-radius: 14px;
            }

            .factor-pill {
                padding: 6px 12px;
                font-size: 1.1rem;
            }

            .factor-row {
                font-size: 1.1rem;
                gap: 8px;
            }

            input {
                font-size: 1.1rem;
                padding: 8px;
            }

            .result-math {
                font-size: 1rem;
            }
        }

        @media (max-width: 480px) {
            .mobile-menu {
                width: 100%;
                max-width: 100vw;
                padding: 16px;
            }

            .mobile-menu input {
                width: 70px;
                font-size: 1rem;
                padding: 6px;
                min-height: 40px;
            }

            .mobile-menu .tab {
                font-size: 0.65rem;
                padding: 8px 10px;
                min-height: 38px;
            }

            .mobile-menu .factor-pill {
                padding: 5px 10px;
                font-size: 0.9rem;
            }

            .mobile-menu .factor-row {
                font-size: 1rem;
                gap: 6px;
            }

            .mobile-menu .result-math {
                font-size: 0.95rem;
            }

            .mobile-menu .logic-title {
                font-size: 0.6rem;
            }
        }

        /* Tablet landscape optimization */
        @media (min-width: 769px) and (max-width: 1024px) {
            .ui-top {
                left: 16px;
                max-width: 320px;
            }

            .panel {
                padding: 16px;
            }

            .logic-view {
                padding: 20px;
                width: 85%;
            }
        }

        /* Accessibility focus styles */
        button:focus-visible,
        input:focus-visible,
        .tab:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 2px;
        }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz@14..32&display=swap" rel="stylesheet">
</head>
<body>

<canvas id="canvas"></canvas>

<!-- Hamburger Menu Button -->
<button class="hamburger-btn" id="hamburgerBtn" aria-label="Open menu" aria-expanded="false">
    <span class="icon"></span>
</button>

<!-- Mobile Menu Overlay -->
<div class="mobile-menu-overlay" id="mobileMenuOverlay"></div>

<!-- Mobile Menu Panel -->
<div class="mobile-menu" id="mobileMenu" role="dialog" aria-label="Controls menu">
    <div class="mobile-menu-header">
        <div class="mobile-menu-title">Factor Tree Analysis</div>
        <button class="mobile-menu-close" id="mobileMenuClose" aria-label="Close menu">✕</button>
    </div>

    <div class="mobile-menu-section">
        <div class="mobile-menu-label">Research Targets</div>
        <div class="input-row">
            <input type="number" id="mobileNumA" value="12" min="2" max="60" placeholder="A" aria-label="Number A">
            <input type="number" id="mobileNumB" value="18" min="2" max="60" placeholder="B" aria-label="Number B">
        </div>
    </div>

    <div class="mobile-menu-section">
        <div class="mode-tabs">
            <div class="tab active" id="mobileTabGCF">GCF Analysis</div>
            <div class="tab" id="mobileTabLCM">LCM Analysis</div>
        </div>
    </div>

    <div class="mobile-menu-section">
        <div class="logic-title" id="mobileLogicTitle">Prime Factor Alignment</div>
        
        <div class="factor-section">
            <div class="section-label">Number A Prime Factors</div>
            <div class="factor-row" id="mobileRowA"></div>
        </div>
        
        <div class="factor-section">
            <div class="section-label">Number B Prime Factors</div>
            <div class="factor-row" id="mobileRowB"></div>
        </div>

        <hr class="divider">
        
        <div class="result-math" id="mobileFinalResult">
            <span>GCF:</span> 2 × 3 = 6
        </div>
    </div>
</div>

<!-- Desktop UI -->
<div class="ui-top">
    <div class="panel">
        <div class="label">Research Targets</div>
        <div class="input-row">
            <input type="number" id="numA" value="12" min="2" max="60" placeholder="A" aria-label="Number A">
            <input type="number" id="numB" value="18" min="2" max="60" placeholder="B" aria-label="Number B">
        </div>
        <div class="mode-tabs">
            <div class="tab active" id="tabGCF">GCF Analysis</div>
            <div class="tab" id="tabLCM">LCM Analysis</div>
        </div>
    </div>
</div>

<div class="logic-view">
    <div class="logic-title" id="logicTitle">Prime Factor Alignment</div>
    
    <div class="factor-section">
        <div class="section-label">Number A Prime Factors</div>
        <div class="factor-row" id="rowA"></div>
    </div>
    
    <div class="factor-section">
        <div class="section-label">Number B Prime Factors</div>
        <div class="factor-row" id="rowB"></div>
    </div>

    <hr class="divider">
    
    <div class="result-math" id="finalResult">
        <span>GCF:</span> 2 × 3 = 6
    </div>
</div>

<script>
    (function(){
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        let width, height, mode = 'GCF';
        let nodes = [];

        // Desktop elements
        const numA = document.getElementById('numA');
        const numB = document.getElementById('numB');
        const tabGCF = document.getElementById('tabGCF');
        const tabLCM = document.getElementById('tabLCM');
        const logicTitle = document.getElementById('logicTitle');
        const rowA = document.getElementById('rowA');
        const rowB = document.getElementById('rowB');
        const finalResult = document.getElementById('finalResult');
        
        // Mobile elements
        const mobileNumA = document.getElementById('mobileNumA');
        const mobileNumB = document.getElementById('mobileNumB');
        const mobileTabGCF = document.getElementById('mobileTabGCF');
        const mobileTabLCM = document.getElementById('mobileTabLCM');
        const mobileLogicTitle = document.getElementById('mobileLogicTitle');
        const mobileRowA = document.getElementById('mobileRowA');
        const mobileRowB = document.getElementById('mobileRowB');
        const mobileFinalResult = document.getElementById('mobileFinalResult');
        
        // Mobile menu elements
        const hamburgerBtn = document.getElementById('hamburgerBtn');
        const mobileMenu = document.getElementById('mobileMenu');
        const mobileMenuOverlay = document.getElementById('mobileMenuOverlay');
        const mobileMenuClose = document.getElementById('mobileMenuClose');

        // Light mode colors
        const colors = {
            bg: '#f8fafc',
            grid: '#e2e8f0',
            nodeStroke: '#3b82f6',
            nodeFill: '#ffffff',
            nodeText: '#0f172a',
            primeFill: '#dbeafe',
            primeText: '#3b82f6'
        };

        function getPrimeFactors(n) {
            const factors = [];
            let d = 2;
            let temp = n;
            while (temp > 1) {
                while (temp % d === 0) {
                    factors.push(d);
                    temp /= d;
                }
                d++;
            }
            return factors;
        }

        function createTree(val, startX, startY, side) {
            let currentNodes = [];
            const factorize = (n, x, y, level) => {
                currentNodes.push({ v: n, x, y, level, side });
                if (isPrime(n)) return;

                const f1 = getSmallestFactor(n);
                const f2 = n / f1;
                const xOffset = 60 / (level + 1);
                
                factorize(f1, x - xOffset, y + 50, level + 1);
                factorize(f2, x + xOffset, y + 50, level + 1);
            };
            factorize(val, startX, startY, 0);
            return currentNodes;
        }

        function isPrime(n) {
            for(let i = 2; i <= Math.sqrt(n); i++) if(n % i === 0) return false;
            return n > 1;
        }

        function getSmallestFactor(n) {
            for(let i = 2; i <= Math.sqrt(n); i++) if(n % i === 0) return i;
            return n;
        }

        function update() {
            const a = parseInt(numA.value) || 2;
            const b = parseInt(numB.value) || 2;
            
            // Sync mobile inputs
            mobileNumA.value = a;
            mobileNumB.value = b;
            
            nodes = [...createTree(a, width * 0.3, 100, 'A'), ...createTree(b, width * 0.7, 100, 'B')];

            const factorsA = getPrimeFactors(a);
            const factorsB = getPrimeFactors(b);
            
            // Clear both displays
            rowA.innerHTML = ''; 
            rowB.innerHTML = '';
            mobileRowA.innerHTML = ''; 
            mobileRowB.innerHTML = '';

            let resultHTML = '';
            let logicTitleText = '';

            if (mode === 'GCF') {
                logicTitleText = 'Prime Factor Alignment';
                const shared = [];
                const pA = factorsA.map(f => ({v: f, hl: false}));
                const pB = factorsB.map(f => ({v: f, hl: false}));

                pA.forEach(itemA => {
                    const match = pB.find(itemB => !itemB.hl && itemB.v === itemA.v);
                    if (match) {
                        itemA.hl = true;
                        match.hl = true;
                        shared.push(itemA.v);
                    }
                });

                const factorHTMLA = pA.map(f => `<div class="factor-pill ${f.hl ? 'highlight' : ''}">${f.v}</div>`).join('');
                const factorHTMLB = pB.map(f => `<div class="factor-pill ${f.hl ? 'highlight' : ''}">${f.v}</div>`).join('');
                
                rowA.innerHTML = factorHTMLA;
                rowB.innerHTML = factorHTMLB;
                mobileRowA.innerHTML = factorHTMLA;
                mobileRowB.innerHTML = factorHTMLB;
                
                const gcf = shared.reduce((p, c) => p * c, 1) || 1;
                const formula = shared.length ? shared.join(' × ') : '1';
                resultHTML = `<span>GCF:</span> ${formula} = ${gcf}`;
            } else {
                logicTitleText = 'LCM Prime Alignment';
                // LCM Logic
                const countsA = {}; 
                const countsB = {}; 
                
                factorsA.forEach(f => countsA[f] = (countsA[f] || 0) + 1);
                factorsB.forEach(f => countsB[f] = (countsB[f] || 0) + 1);
                
                const allPrimesSet = new Set([...factorsA, ...factorsB]);
                const allPrimes = Array.from(allPrimesSet).sort((a, b) => a - b);
                
                const lcmFactors = [];
                allPrimes.forEach(p => {
                    const countA = countsA[p] || 0;
                    const countB = countsB[p] || 0;
                    const maxCount = Math.max(countA, countB);
                    for(let i = 0; i < maxCount; i++) {
                        lcmFactors.push(p);
                    }
                });

                const factorHTMLA = factorsA.map(f => `<div class="factor-pill highlight">${f}</div>`).join('');
                const factorHTMLB = factorsB.map(f => `<div class="factor-pill highlight">${f}</div>`).join('');
                
                rowA.innerHTML = factorHTMLA;
                rowB.innerHTML = factorHTMLB;
                mobileRowA.innerHTML = factorHTMLA;
                mobileRowB.innerHTML = factorHTMLB;
                
                const lcm = lcmFactors.reduce((p, c) => p * c, 1);
                const formula = lcmFactors.length > 0 ? lcmFactors.join(' × ') : '1';
                resultHTML = `<span>LCM:</span> ${formula} = ${lcm}`;
            }
            
            finalResult.innerHTML = resultHTML;
            mobileFinalResult.innerHTML = resultHTML;
            logicTitle.textContent = logicTitleText;
            mobileLogicTitle.textContent = logicTitleText;
        }

        function setMode(m) {
            mode = m;
            // Update desktop tabs
            tabGCF.classList.toggle('active', m === 'GCF');
            tabLCM.classList.toggle('active', m === 'LCM');
            // Update mobile tabs
            mobileTabGCF.classList.toggle('active', m === 'GCF');
            mobileTabLCM.classList.toggle('active', m === 'LCM');
            update();
        }

        // Mobile menu functions
        function openMobileMenu() {
            mobileMenu.classList.add('open');
            mobileMenuOverlay.classList.add('active');
            hamburgerBtn.classList.add('open');
            hamburgerBtn.setAttribute('aria-expanded', 'true');
            // Sync input values and UI state
            mobileNumA.value = numA.value;
            mobileNumB.value = numB.value;
            mobileTabGCF.classList.toggle('active', mode === 'GCF');
            mobileTabLCM.classList.toggle('active', mode === 'LCM');
        }

        function closeMobileMenu() {
            mobileMenu.classList.remove('open');
            mobileMenuOverlay.classList.remove('active');
            hamburgerBtn.classList.remove('open');
            hamburgerBtn.setAttribute('aria-expanded', 'false');
            // Sync values back
            numA.value = mobileNumA.value;
            numB.value = mobileNumB.value;
        }

        function toggleMobileMenu() {
            if (mobileMenu.classList.contains('open')) {
                closeMobileMenu();
            } else {
                openMobileMenu();
            }
        }

        // Desktop event listeners
        window.setMode = setMode;
        
        tabGCF.onclick = () => setMode('GCF');
        tabLCM.onclick = () => setMode('LCM');
        
        numA.oninput = update;
        numB.oninput = update;
        
        // Mobile event listeners
        mobileTabGCF.onclick = () => {
            setMode('GCF');
            if (window.innerWidth <= 768) {
                closeMobileMenu();
            }
        };
        
        mobileTabLCM.onclick = () => {
            setMode('LCM');
            if (window.innerWidth <= 768) {
                closeMobileMenu();
            }
        };
        
        mobileNumA.oninput = () => {
            numA.value = mobileNumA.value;
            update();
        };
        
        mobileNumB.oninput = () => {
            numB.value = mobileNumB.value;
            update();
        };
        
        // Mobile menu event listeners
        hamburgerBtn.addEventListener('click', toggleMobileMenu);
        mobileMenuClose.addEventListener('click', closeMobileMenu);
        mobileMenuOverlay.addEventListener('click', closeMobileMenu);
        
        // Close mobile menu on Escape key
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && mobileMenu.classList.contains('open')) {
                closeMobileMenu();
            }
        });

        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width * devicePixelRatio;
            canvas.height = height * devicePixelRatio;
            canvas.style.width = width + 'px';
            canvas.style.height = height + 'px';
            ctx.scale(devicePixelRatio, devicePixelRatio);
            update();
        }

        function drawBackground() {
            // Soft grid
            ctx.strokeStyle = colors.grid;
            ctx.lineWidth = 1;
            ctx.beginPath();
            for(let i = 0; i < width; i += 60) { 
                ctx.moveTo(i, 0); 
                ctx.lineTo(i, height); 
            }
            for(let i = 0; i < height; i += 60) { 
                ctx.moveTo(0, i); 
                ctx.lineTo(width, i); 
            }
            ctx.stroke();
        }

        function drawTree() {
            // Draw edges first
            ctx.strokeStyle = colors.nodeStroke;
            ctx.lineWidth = 2;
            nodes.forEach(n => {
                const children = nodes.filter(c => 
                    (c.side === n.side) && 
                    Math.abs(c.level - n.level) === 1 &&
                    Math.abs(c.x - n.x) < 100
                );
                children.forEach(c => {
                    ctx.beginPath();
                    ctx.moveTo(n.x, n.y);
                    ctx.lineTo(c.x, c.y);
                    ctx.stroke();
                });
            });

            // Draw nodes
            nodes.forEach(n => {
                ctx.beginPath();
                ctx.arc(n.x, n.y, 18, 0, Math.PI * 2);
                ctx.fillStyle = isPrime(n.v) ? colors.primeFill : colors.nodeFill;
                ctx.fill();
                ctx.strokeStyle = colors.nodeStroke;
                ctx.lineWidth = 2.5;
                ctx.stroke();
                
                ctx.fillStyle = isPrime(n.v) ? colors.primeText : colors.nodeText;
                ctx.font = '600 14px "SF Mono", "Menlo", monospace';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(n.v, n.x, n.y);
            });
        }

        function loop() {
            ctx.clearRect(0, 0, width, height);
            ctx.fillStyle = colors.bg;
            ctx.fillRect(0, 0, width, height);
            
            drawBackground();
            drawTree();

            requestAnimationFrame(loop);
        }

        window.onresize = resize;
        
        resize();
        loop();
    })();
</script>
</body>
</html>
