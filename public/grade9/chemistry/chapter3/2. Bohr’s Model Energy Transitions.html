<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
  <title>⚡ CRT · e/m deflection</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      background: #f0f4fa;
      min-height: 100dvh;
      padding: 16px;
    }

    /* main container */
    .app {
      max-width: 1280px;
      margin: 0 auto;
    }

    /* responsive grid: canvas + sidebar */
    .dashboard {
      display: grid;
      grid-template-columns: 1fr;
      gap: 20px;
    }

    @media (min-width: 720px) {
      .dashboard {
        grid-template-columns: 1fr 300px;
      }
    }

    /* canvas card */
    .canvas-panel {
      background: #ffffff;
      border-radius: 32px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.04), 0 0 0 1px rgba(0, 0, 0, 0.02);
      padding: 20px;
    }

    canvas {
      display: block;
      width: 100%;
      aspect-ratio: 16 / 10;
      background: #fafeff;
      border-radius: 20px;
      border: 1px solid #dee9f2;
      cursor: crosshair;
    }

    .legend {
      display: flex;
      gap: 20px;
      justify-content: center;
      margin-top: 12px;
      font-size: 0.7rem;
      font-weight: 500;
      color: #2c5c8c;
    }

    /* collapsible sidebar (mobile hamburger) */
    .sidebar {
      background: #ffffff;
      border-radius: 32px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.04);
      overflow: hidden;
      transition: all 0.25s ease;
    }

    /* mobile collapsed state */
    @media (max-width: 719px) {
      .sidebar.collapsed {
        max-height: 72px;
      }
      .sidebar:not(.collapsed) {
        max-height: 600px;
      }
    }

    .sidebar-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 18px 20px;
      background: #ffffff;
      border-bottom: 1px solid #eef2f8;
      cursor: pointer;
    }

    .sidebar-header h3 {
      font-size: 1rem;
      font-weight: 600;
      color: #0b355c;
      letter-spacing: -0.2px;
    }

    .chevron {
      font-size: 1.2rem;
      transition: transform 0.2s;
      color: #3b82f6;
    }

    .sidebar.collapsed .chevron {
      transform: rotate(180deg);
    }

    .sidebar-content {
      padding: 20px;
    }

    /* mode toggle (electric/magnetic) */
    .mode-group {
      display: flex;
      gap: 10px;
      margin-bottom: 24px;
    }

    .mode-btn {
      flex: 1;
      padding: 12px;
      border-radius: 60px;
      border: 1.5px solid #d4e2fa;
      background: #ffffff;
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
      color: #3a628c;
      transition: all 0.15s;
    }

    .mode-btn.active {
      background: #3b82f6;
      border-color: #3b82f6;
      color: white;
      box-shadow: 0 2px 8px rgba(59,130,246,0.3);
    }

    /* sliders */
    .slider-item {
      margin: 20px 0;
    }

    .slider-head {
      display: flex;
      justify-content: space-between;
      font-weight: 500;
      font-size: 0.8rem;
      color: #1f4870;
      margin-bottom: 8px;
    }

    input[type="range"] {
      width: 100%;
      height: 5px;
      background: #d9e6f5;
      border-radius: 10px;
      -webkit-appearance: none;
      appearance: none;
    }

    input[type="range"]:focus {
      outline: none;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 20px;
      height: 20px;
      background: #3b82f6;
      border-radius: 50%;
      border: 3px solid white;
      box-shadow: 0 1px 4px rgba(0,0,0,0.2);
      cursor: grab;
    }

    /* impact card */
    .impact-card {
      background: #f6faff;
      border-radius: 24px;
      padding: 16px;
      text-align: center;
      margin: 20px 0;
    }

    .impact-label {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #2c6288;
    }

    .impact-value {
      font-size: 2rem;
      font-weight: 800;
      color: #3b82f6;
      font-family: monospace;
    }

    .action-btn {
      width: 100%;
      background: #f0f4fc;
      border: none;
      border-radius: 60px;
      padding: 12px;
      font-weight: 600;
      color: #2c6288;
      cursor: pointer;
      font-size: 0.8rem;
      margin-top: 8px;
    }

    .info-note {
      font-size: 0.7rem;
      text-align: center;
      color: #6b8fae;
      margin-top: 16px;
      padding-top: 12px;
      border-top: 1px solid #eaf0f6;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .logo {
      font-weight: 700;
      font-size: 1.2rem;
      background: linear-gradient(135deg, #1f4870, #2c6288);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .menu-icon {
      background: #eef3fc;
      border: none;
      border-radius: 40px;
      padding: 8px 16px;
      font-weight: 600;
      font-size: 0.8rem;
      color: #1f4870;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    @media (min-width: 720px) {
      .menu-icon {
        display: none;
      }
    }
  </style>
</head>
<body>
<div class="app">
  <div class="top-bar">
    <div class="logo">⚡ e/m · CRT deflector</div>
    <button class="menu-icon" id="hamburgerBtn">☰ controls</button>
  </div>

  <div class="dashboard">
    <!-- Canvas Visualization -->
    <div class="canvas-panel">
      <canvas id="crtCanvas"></canvas>
      <div class="legend">
        <span style="color:#3b82f6">● electron beam</span>
        <span style="color:#ef4444">▬ deflection plates</span>
        <span>✨ trace history</span>
      </div>
    </div>

    <!-- Collapsible Sidebar (controls) -->
    <div class="sidebar collapsed" id="controlSidebar">
      <div class="sidebar-header" id="sidebarToggle">
        <h3>⚙️ beam controls</h3>
        <span class="chevron" id="chevIcon">▼</span>
      </div>
      <div class="sidebar-content">
        <!-- Mode switcher -->
        <div class="mode-group">
          <button class="mode-btn active" data-mode="E">⚡ electric</button>
          <button class="mode-btn" data-mode="M">🧲 magnetic</button>
        </div>

        <!-- field strength slider -->
        <div class="slider-item">
          <div class="slider-head">
            <span>📡 field intensity</span>
            <span id="fieldValDisplay">0</span>
          </div>
          <input type="range" id="fieldSlider" min="-15" max="15" value="0" step="0.5">
        </div>

        <!-- beam speed slider -->
        <div class="slider-item">
          <div class="slider-head">
            <span>⚡ beam speed</span>
            <span id="speedValDisplay">10</span>
          </div>
          <input type="range" id="speedSlider" min="5" max="18" value="10" step="0.5">
        </div>

        <!-- deflection readout -->
        <div class="impact-card">
          <div class="impact-label">deflection at screen</div>
          <div class="impact-value" id="deflectionMm">0.0</div>
          <div style="font-size:0.7rem;">millimeters</div>
        </div>

        <!-- utility buttons -->
        <button id="clearBeamBtn" class="action-btn">🗑️ clear traces</button>
        <div class="info-note" id="dynamicTheory">
          ⚡ electric field · parabolic path · e⁻ bends toward + plate
        </div>
      </div>
    </div>
  </div>
</div>

<script>
  (function() {
    // --- DOM elements ---
    const canvas = document.getElementById('crtCanvas');
    const ctx = canvas.getContext('2d');
    const fieldSlider = document.getElementById('fieldSlider');
    const speedSlider = document.getElementById('speedSlider');
    const fieldValSpan = document.getElementById('fieldValDisplay');
    const speedValSpan = document.getElementById('speedValDisplay');
    const deflectionSpan = document.getElementById('deflectionMm');
    const clearBtn = document.getElementById('clearBeamBtn');
    const modeBtns = document.querySelectorAll('[data-mode]');
    const dynamicTheory = document.getElementById('dynamicTheory');
    const sidebar = document.getElementById('controlSidebar');
    const sidebarToggle = document.getElementById('sidebarToggle');
    const hamburgerBtn = document.getElementById('hamburgerBtn');

    let mode = 'E';               // 'E' or 'M'
    let particles = [];
    let width = 0, height = 0;
    let dpr = window.devicePixelRatio || 1;
    let frameRequest;
    let frameCounter = 0;

    // --- geometry constants (deflection region)
    let deflectStartX = 0, deflectEndX = 0;

    // --- helper functions
    function resizeCanvas() {
      const container = canvas.parentElement;
      const rect = container.getBoundingClientRect();
      width = rect.width;
      height = width * 10 / 16;   // maintain 16:10 ratio
      canvas.width = width * dpr;
      canvas.height = height * dpr;
      canvas.style.width = `${width}px`;
      canvas.style.height = `${height}px`;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      // update deflection region boundaries (20% to 65% of width)
      deflectStartX = width * 0.2;
      deflectEndX = width * 0.65;
    }

    // update UI readings
    function updateSlidersReadout() {
      fieldValSpan.textContent = parseFloat(fieldSlider.value).toFixed(1);
      speedValSpan.textContent = parseFloat(speedSlider.value).toFixed(1);
    }

    // set active mode and update theory text
    function setActiveMode(selectedMode) {
      mode = selectedMode;
      modeBtns.forEach(btn => {
        if (btn.dataset.mode === mode) {
          btn.classList.add('active');
        } else {
          btn.classList.remove('active');
        }
      });
      // update compact theory note
      if (mode === 'E') {
        dynamicTheory.innerHTML = '⚡ electric · parabolic path · e⁻ → + plate';
      } else {
        dynamicTheory.innerHTML = '🧲 magnetic · circular arc · force ⟂ velocity';
      }
    }

    // ----- Particle class with realistic deflection physics
    class Electron {
      constructor(speedVal) {
        this.x = 20;                       // entry
        this.y = height / 2;
        this.vx = speedVal * 0.85;         // scaled for smooth motion
        this.vy = 0;
        this.history = [];
        this.active = true;
      }

      update() {
        // store trail
        this.history.push({ x: this.x, y: this.y });
        if (this.history.length > 40) this.history.shift();

        const fieldStrength = parseFloat(fieldSlider.value);
        const inDeflectionZone = (this.x > deflectStartX && this.x < deflectEndX);
        
        if (inDeflectionZone && Math.abs(fieldStrength) > 0.15) {
          if (mode === 'E') {
            // Electric field: vertical acceleration (parabolic)
            // sign determines direction (positive field = upward deflection)
            this.vy += fieldStrength * 0.048;
          } 
          else { // Magnetic field: Lorentz force perpendicular to velocity
            const speed = Math.hypot(this.vx, this.vy);
            if (speed > 0.01) {
              // force magnitude proportional to field strength and velocity
              const forceMag = fieldStrength * 0.022;
              // direction: perpendicular (rotate velocity vector)
              const angle = Math.atan2(this.vy, this.vx);
              // magnetic force changes direction: perpendicular component
              const perpX = -Math.sin(angle);
              const perpY = Math.cos(angle);
              this.vx += perpX * forceMag;
              this.vy += perpY * forceMag;
              // optional speed normalization (preserve energy approx)
              const newSpeed = Math.hypot(this.vx, this.vy);
              const targetSpeed = parseFloat(speedSlider.value) * 0.85;
              if (newSpeed > 0.01) {
                this.vx = (this.vx / newSpeed) * targetSpeed;
                this.vy = (this.vy / newSpeed) * targetSpeed;
              }
            }
          }
        }

        // update position
        this.x += this.vx;
        this.y += this.vy;

        // check if particle hits right edge (screen) or out of bounds
        if (this.x >= width - 12 || this.y < 0 || this.y > height) {
          this.active = false;
          // compute deflection magnitude (mm scale) -> from center Y to final Y
          const centerY = height / 2;
          const deflectionPx = this.y - centerY;
          const mmEquivalent = (deflectionPx * 0.7).toFixed(1);
          deflectionSpan.textContent = mmEquivalent;
        }
      }

      draw() {
        // draw trail
        if (this.history.length > 1) {
          ctx.beginPath();
          ctx.strokeStyle = mode === 'E' ? '#3b82f6' : '#10b981';
          ctx.lineWidth = 2.2;
          ctx.lineCap = 'round';
          for (let i = 0; i < this.history.length; i++) {
            if (i === 0) ctx.moveTo(this.history[i].x, this.history[i].y);
            else ctx.lineTo(this.history[i].x, this.history[i].y);
          }
          ctx.stroke();
        }
        // draw electron
        ctx.beginPath();
        ctx.arc(this.x, this.y, 4, 0, Math.PI * 2);
        ctx.fillStyle = '#3b82f6';
        ctx.shadowBlur = 12;
        ctx.shadowColor = '#3b82f680';
        ctx.fill();
        ctx.shadowBlur = 0;
      }
    }

    // --- drawing routine (background, plates, particles)
    function drawBackground() {
      ctx.fillStyle = '#fafeff';
      ctx.fillRect(0, 0, width, height);
      
      // electron gun indication (left side)
      ctx.fillStyle = '#475569';
      ctx.beginPath();
      ctx.rect(8, height/2 - 10, 18, 20);
      ctx.fill();
      ctx.fillStyle = '#e2e8f0';
      ctx.font = 'bold 8px monospace';
      ctx.fillText('e⁻ gun', 8, height/2 - 12);
      
      // deflection plates (upper and lower)
      const plateY_top = height/2 - 48;
      const plateY_bottom = height/2 + 38;
      const plateWidth = deflectEndX - deflectStartX;
      ctx.fillStyle = '#ef4444cc';
      ctx.fillRect(deflectStartX, plateY_top, plateWidth, 6);
      ctx.fillRect(deflectStartX, plateY_bottom, plateWidth, 6);
      
      // field lines effect if field is strong
      const fieldVal = parseFloat(fieldSlider.value);
      if (Math.abs(fieldVal) > 1.0) {
        ctx.strokeStyle = '#3b82f620';
        ctx.lineWidth = 1;
        for (let x = deflectStartX + 10; x < deflectEndX; x += 24) {
          ctx.beginPath();
          ctx.moveTo(x, plateY_top + 6);
          ctx.lineTo(x, plateY_bottom);
          ctx.stroke();
        }
      }
      
      // phosphor screen (right edge)
      ctx.fillStyle = '#1e293b';
      ctx.fillRect(width - 12, height/2 - 45, 8, 90);
      ctx.fillStyle = '#cbd5e1';
      ctx.font = '7px monospace';
      ctx.fillText('screen', width-30, height/2);
      
      // center axis reference
      ctx.beginPath();
      ctx.strokeStyle = '#94a3b840';
      ctx.setLineDash([5, 5]);
      ctx.moveTo(10, height/2);
      ctx.lineTo(width-15, height/2);
      ctx.stroke();
      ctx.setLineDash([]);
    }
    
    function animate() {
      if (!ctx) return;
      drawBackground();
      
      // spawn new electrons with current speed
      const currentSpeed = parseFloat(speedSlider.value);
      if (frameCounter % 28 === 0) {
        particles.push(new Electron(currentSpeed));
      }
      
      // update & draw all particles
      particles = particles.filter(p => {
        p.update();
        p.draw();
        return p.active;
      });
      
      frameCounter++;
      frameRequest = requestAnimationFrame(animate);
    }

    // --- Interaction handlers
    function clearTraces() {
      particles = [];
      deflectionSpan.textContent = '0.0';
    }
    
    function syncFromSliders() {
      updateSlidersReadout();
      // no need to update particles immediately; next spawn uses new speed
    }
    
    // Sidebar collapse logic (responsive)
    function toggleSidebar(forceCollapse) {
      if (window.innerWidth < 720) {
        if (forceCollapse === true) sidebar.classList.add('collapsed');
        else if (forceCollapse === false) sidebar.classList.remove('collapsed');
        else sidebar.classList.toggle('collapsed');
      } else {
        sidebar.classList.remove('collapsed');
      }
    }
    
    // --- Event binding
    fieldSlider.addEventListener('input', () => {
      updateSlidersReadout();
    });
    speedSlider.addEventListener('input', () => {
      updateSlidersReadout();
    });
    
    clearBtn.addEventListener('click', clearTraces);
    
    modeBtns.forEach(btn => {
      btn.addEventListener('click', (e) => {
        const newMode = btn.dataset.mode;
        if (newMode === 'E' || newMode === 'M') {
          setActiveMode(newMode);
          clearTraces();   // reset trajectories for clarity
        }
      });
    });
    
    // sidebar toggle (both header click and hamburger)
    const toggleFunc = () => toggleSidebar();
    sidebarToggle.addEventListener('click', toggleFunc);
    if (hamburgerBtn) hamburgerBtn.addEventListener('click', toggleFunc);
    
    window.addEventListener('resize', () => {
      resizeCanvas();
      clearTraces();
      if (window.innerWidth >= 720) sidebar.classList.remove('collapsed');
      else sidebar.classList.add('collapsed');
    });
    
    // init
    resizeCanvas();
    setActiveMode('E');
    updateSlidersReadout();
    clearTraces();
    // start simulation
    animate();
    
    // add mobile touch optimizations (prevent double tap zoom)
    canvas.addEventListener('touchstart', (e) => { e.preventDefault(); });
  })();
</script>
</body>
</html>
