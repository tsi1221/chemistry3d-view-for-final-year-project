<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>photoelectric · quantum</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      background: #f5f9ff;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 12px;
    }

    .dashboard {
      display: grid;
      grid-template-columns: 1fr;
      gap: 16px;
      width: 100%;
      max-width: 1050px;
      margin: 0 auto;
    }

    @media (min-width: 768px) {
      .dashboard {
        grid-template-columns: 1fr 280px;
        align-items: start;
      }
    }

    /* canvas panel */
    .canvas-panel {
      background: #ffffff;
      border-radius: 28px;
      border: 1px solid #d9e9ff;
      box-shadow: 0 12px 30px rgba(0, 20, 50, 0.06);
      padding: 16px;
      display: flex;
      flex-direction: column;
    }

    .panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      padding: 0 4px;
    }

    .panel-header h2 {
      font-weight: 600;
      font-size: 1.3rem;
      color: #0b2b4f;
      letter-spacing: -0.3px;
    }

    .legend {
      display: flex;
      gap: 18px;
      font-size: 0.8rem;
      font-weight: 500;
      color: #2c4b6b;
    }

    .legend span {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    canvas {
      display: block;
      width: 100%;
      aspect-ratio: 16 / 10;
      background: #fafdff;
      border-radius: 20px;
      border: 1px solid #d4e3fc;
      touch-action: none;
      margin-top: 6px;
    }

    /* sidebar */
    .sidebar {
      background: #ffffff;
      border-radius: 28px;
      border: 1px solid #d9e9ff;
      box-shadow: 0 12px 30px rgba(0, 20, 50, 0.06);
      overflow: hidden;
      transition: all 0.25s ease;
    }

    .sidebar-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 18px;
      background: #ffffff;
      cursor: pointer;
      user-select: none;
      border-bottom: 1px solid #e9f0fa;
    }

    .sidebar-header h3 {
      font-weight: 600;
      font-size: 1.1rem;
      color: #0b2b4f;
    }

    .hamburger {
      display: flex;
      flex-direction: column;
      gap: 5px;
      background: none;
      border: none;
      padding: 6px;
      cursor: pointer;
    }

    .hamburger span {
      display: block;
      width: 22px;
      height: 2.5px;
      background: #2c4b6b;
      border-radius: 4px;
      transition: 0.2s;
    }

    .sidebar-content {
      padding: 16px 18px 20px;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .sidebar.collapsed .sidebar-content {
      display: none;
    }

    @media (min-width: 768px) {
      .hamburger {
        display: none;
      }
      .sidebar.collapsed .sidebar-content {
        display: flex;
      }
      .sidebar-header {
        cursor: default;
        border-bottom: 1px solid #e9f0fa;
      }
    }

    /* color selection */
    .color-label {
      font-weight: 600;
      font-size: 0.9rem;
      color: #1e3b5c;
      margin-bottom: 4px;
    }

    .color-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }

    .color-btn {
      aspect-ratio: 1;
      border-radius: 14px;
      border: 3px solid transparent;
      cursor: pointer;
      transition: 0.2s;
    }

    .color-btn.active {
      border-color: #2563eb;
      box-shadow: 0 0 0 2px white, 0 0 0 5px #3b82f6;
    }

    .violet { background: #8b5cf6; }
    .blue { background: #3b82f6; }
    .green { background: #10b981; }
    .yellow { background: #f59e0b; }
    .orange { background: #f97316; }
    .red { background: #ef4444; }

    /* intensity buttons */
    .intensity-row {
      display: flex;
      gap: 8px;
    }

    .intensity-btn {
      flex: 1;
      padding: 10px 4px;
      border-radius: 30px;
      border: 1.5px solid #d0e2ff;
      background: white;
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
      color: #1e3b5c;
    }

    .intensity-btn.active {
      background: #2563eb;
      border-color: #2563eb;
      color: white;
    }

    /* energy bar */
    .energy-row {
      display: flex;
      justify-content: space-between;
      font-size: 0.85rem;
      font-weight: 500;
      color: #1e3b5c;
    }

    .energy-bar {
      height: 10px;
      background: #e2e8f0;
      border-radius: 12px;
      margin: 6px 0 4px;
      overflow: hidden;
    }

    .energy-fill {
      height: 100%;
      width: 0%;
      transition: width 0.2s ease;
      border-radius: 12px;
    }

    .status-badge {
      padding: 12px;
      border-radius: 16px;
      text-align: center;
      font-weight: 700;
      font-size: 0.9rem;
    }

    .status-ok {
      background: #d1fae5;
      color: #065f46;
    }

    .status-fail {
      background: #fee2e2;
      color: #991b1b;
    }

    /* accordion for notes */
    .accordion {
      border-top: 1px solid #e5eff9;
      padding-top: 6px;
      margin-top: 2px;
    }

    .accordion-toggle {
      background: none;
      border: none;
      width: 100%;
      text-align: left;
      font-weight: 600;
      font-size: 0.9rem;
      color: #0b2b4f;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 0;
      cursor: pointer;
    }

    .accordion-content {
      font-size: 0.85rem;
      color: #2c4b6b;
      display: none;
      padding-bottom: 8px;
      line-height: 1.5;
    }

    .accordion.open .accordion-content {
      display: block;
    }
  </style>
</head>
<body>
<div class="dashboard">
  <!-- canvas panel -->
  <div class="canvas-panel">
    <div class="panel-header">
      <h2>💡 photoelectric</h2>
      <div class="legend">
        <span style="color:#fbbf24;">● photon</span>
        <span style="color:#2563eb;">● electron</span>
        <span style="color:#64748b;">▬ metal</span>
      </div>
    </div>
    <canvas id="peCanvas"></canvas>
  </div>

  <!-- interactive sidebar -->
  <div class="sidebar" id="sidebar">
    <div class="sidebar-header" id="sidebarToggleBtn">
      <h3>⚙️ controls</h3>
      <button class="hamburger" id="hamburgerIcon">
        <span></span><span></span><span></span>
      </button>
    </div>
    <div class="sidebar-content">
      <div>
        <div class="color-label">🌈 photon color</div>
        <div class="color-grid">
          <div class="color-btn violet active" data-nm="400"></div>
          <div class="color-btn blue" data-nm="480"></div>
          <div class="color-btn green" data-nm="540"></div>
          <div class="color-btn yellow" data-nm="590"></div>
          <div class="color-btn orange" data-nm="620"></div>
          <div class="color-btn red" data-nm="700"></div>
        </div>
      </div>

      <div>
        <div class="color-label" style="margin-bottom:6px;">☀️ intensity</div>
        <div class="intensity-row">
          <button class="intensity-btn" data-i="2">low</button>
          <button class="intensity-btn active" data-i="5">med</button>
          <button class="intensity-btn" data-i="9">high</button>
        </div>
      </div>

      <div>
        <div class="energy-row">
          <span>photon energy</span>
          <span id="eVal" style="font-weight:700;">3.10 eV</span>
        </div>
        <div class="energy-bar">
          <div class="energy-fill" id="eFill"></div>
        </div>
      </div>

      <div id="statusBox" class="status-badge status-fail">🔴 below threshold</div>

      <!-- accordion for details -->
      <div class="accordion" id="infoAccordion">
        <button class="accordion-toggle" id="accordionToggle">
          <span>📘 principle</span>
          <span id="accordionArrow">▼</span>
        </button>
        <div class="accordion-content">
          <p>Φ = 3.8 eV (work function)</p>
          <p>Only light with frequency above threshold ejects electrons. Higher frequency → more kinetic energy.</p>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
  (function() {
    const canvas = document.getElementById('peCanvas');
    const ctx = canvas.getContext('2d');

    let w = 0, h = 0;
    const DPR = devicePixelRatio || 1;

    // simulation state
    let photons = [];
    let electrons = [];
    let nm = 400;
    let intensity = 5;
    const WORK_FUNCTION = 3.8; // eV

    // UI elements
    const eValDisplay = document.getElementById('eVal');
    const eFill = document.getElementById('eFill');
    const statusBox = document.getElementById('statusBox');

    const colorMap = {
      400: '#8b5cf6',
      480: '#3b82f6',
      540: '#10b981',
      590: '#f59e0b',
      620: '#f97316',
      700: '#ef4444'
    };

    // ---- sidebar collapse logic ----
    const sidebar = document.getElementById('sidebar');
    const sidebarToggleBtn = document.getElementById('sidebarToggleBtn');
    const hamburgerIcon = document.getElementById('hamburgerIcon');

    function isMobile() {
      return window.innerWidth < 768;
    }

    function toggleSidebar() {
      if (!isMobile()) return;
      sidebar.classList.toggle('collapsed');
    }

    sidebarToggleBtn.addEventListener('click', (e) => {
      if (e.target === hamburgerIcon || hamburgerIcon.contains(e.target) || e.target === sidebarToggleBtn || e.target.tagName === 'H3') {
        toggleSidebar();
      }
    });

    function handleResponsiveState() {
      if (isMobile()) {
        sidebar.classList.add('collapsed');
      } else {
        sidebar.classList.remove('collapsed');
      }
    }
    window.addEventListener('resize', handleResponsiveState);
    handleResponsiveState();

    // ---- accordion for principle ----
    const accordion = document.getElementById('infoAccordion');
    const accordionToggle = document.getElementById('accordionToggle');
    const accordionArrow = document.getElementById('accordionArrow');

    accordionToggle.addEventListener('click', () => {
      accordion.classList.toggle('open');
      accordionArrow.textContent = accordion.classList.contains('open') ? '▲' : '▼';
    });

    // ---- canvas resize ----
    function resizeCanvas() {
      const container = canvas.parentElement;
      const rect = container.getBoundingClientRect();
      w = rect.width;
      h = rect.width * 10 / 16;
      canvas.width = w * DPR;
      canvas.height = h * DPR;
      canvas.style.width = w + 'px';
      canvas.style.height = h + 'px';
      ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    }

    // ---- UI update (energy / status) ----
    function updateUI() {
      const energy = 1240 / nm;
      eValDisplay.textContent = energy.toFixed(2) + ' eV';
      const canEject = energy > WORK_FUNCTION;

      eFill.style.width = Math.min(100, (energy / 5) * 100) + '%';
      eFill.style.background = canEject ? '#10b981' : '#ef4444';

      if (canEject) {
        statusBox.textContent = '🟢 ejection active';
        statusBox.className = 'status-badge status-ok';
      } else {
        statusBox.textContent = '🔴 below threshold';
        statusBox.className = 'status-badge status-fail';
      }

      return { canEject, energy };
    }

    // ---- drawing loop ----
    function draw() {
      ctx.clearRect(0, 0, w, h);
      ctx.fillStyle = '#fafdff';
      ctx.fillRect(0, 0, w, h);

      const { canEject, energy } = updateUI();
      const photonColor = colorMap[nm] || '#3b82f6';
      const cathodeX = w * 0.58;

      // draw metal cathode
      ctx.fillStyle = '#64748b';
      ctx.fillRect(cathodeX, h * 0.22, 14, h * 0.56);
      ctx.strokeStyle = canEject ? '#10b981' : '#94a3b8';
      ctx.lineWidth = 2;
      ctx.strokeRect(cathodeX, h * 0.22, 14, h * 0.56);

      // spawn photons based on intensity
      if (Math.random() < intensity / 14) {
        photons.push({
          x: 12,
          y: h * 0.28 + Math.random() * h * 0.44,
          color: photonColor
        });
      }

      // update & draw photons
      photons = photons.filter(p => {
        p.x += 6.8;
        ctx.beginPath();
        ctx.arc(p.x, p.y, 4.2, 0, 2 * Math.PI);
        ctx.fillStyle = p.color;
        ctx.shadowColor = p.color;
        ctx.shadowBlur = 12;
        ctx.fill();
        ctx.shadowBlur = 0;

        if (p.x >= cathodeX - 6) {
          if (canEject) {
            const kineticBase = (energy - WORK_FUNCTION) * 2.2 + 1.5;
            for (let i = 0; i < 2; i++) {
              electrons.push({
                x: p.x,
                y: p.y + (Math.random() - 0.5) * 8,
                vx: -kineticBase - Math.random() * 1.2,
                vy: (Math.random() - 0.5) * 1.8
              });
            }
          }
          return false;
        }
        return true;
      });

      // update & draw electrons
      electrons = electrons.filter(e => {
        e.x += e.vx;
        e.y += e.vy;
        ctx.beginPath();
        ctx.arc(e.x, e.y, 3.8, 0, 2 * Math.PI);
        ctx.fillStyle = '#2563eb';
        ctx.shadowColor = '#3b82f6';
        ctx.shadowBlur = 10;
        ctx.fill();
        ctx.shadowBlur = 0;
        return e.x > -12 && e.x < w + 12 && e.y > -10 && e.y < h + 10;
      });

      requestAnimationFrame(draw);
    }

    // ---- color button listeners ----
    document.querySelectorAll('.color-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.color-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        nm = parseInt(btn.dataset.nm, 10);
      });
    });

    // ---- intensity button listeners ----
    document.querySelectorAll('.intensity-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.intensity-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        intensity = parseInt(btn.dataset.i, 10);
      });
    });

    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();
    draw();
  })();
</script>
</body>
</html>
