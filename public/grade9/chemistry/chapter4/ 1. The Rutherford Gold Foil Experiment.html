<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>⚛️ orbital config · 4d</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      background: #f5f9ff;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 12px;
    }

    .dashboard {
      display: grid;
      grid-template-columns: 1fr;
      gap: 16px;
      width: 100%;
      max-width: 1000px;
      margin: 0 auto;
    }

    @media (min-width: 768px) {
      .dashboard {
        grid-template-columns: 1fr 270px;
        align-items: start;
      }
    }

    /* panels */
    .panel {
      background: #ffffff;
      border-radius: 28px;
      border: 1px solid #d9e9ff;
      box-shadow: 0 12px 30px rgba(0, 20, 50, 0.06);
      padding: 18px;
    }

    .panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .panel-header h2 {
      font-weight: 600;
      font-size: 1.3rem;
      color: #0b2b4f;
      letter-spacing: -0.3px;
    }

    .legend {
      display: flex;
      gap: 16px;
      font-size: 0.75rem;
      color: #43668c;
      font-weight: 500;
    }

    /* orbital stack */
    .stack {
      display: flex;
      flex-direction: column-reverse;
      gap: 8px;
    }

    .subshell {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 4px 0;
    }

    .label {
      width: 44px;
      font-weight: 700;
      font-family: 'JetBrains Mono', 'Courier New', monospace;
      color: #2563eb;
      font-size: 0.9rem;
    }

    .boxes {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .box {
      width: 36px;
      height: 36px;
      border: 2px solid #d0e2ff;
      background: #ffffff;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: 0.15s;
      user-select: none;
    }

    .box:active {
      background: #eef4ff;
      border-color: #3b82f6;
    }

    .arrow {
      font-size: 19px;
      font-weight: 700;
      line-height: 1;
    }

    .up {
      color: #10b981;
    }

    .down {
      color: #ef4444;
      margin-left: -5px;
    }

    /* sidebar */
    .sidebar {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .sidebar-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      user-select: none;
      padding-bottom: 8px;
      border-bottom: 1px solid #e9f0fa;
    }

    .sidebar-header h3 {
      font-weight: 600;
      font-size: 1rem;
      color: #1e3b5c;
    }

    .hamburger {
      display: flex;
      flex-direction: column;
      gap: 5px;
      background: none;
      border: none;
      padding: 6px;
      cursor: pointer;
    }

    .hamburger span {
      display: block;
      width: 20px;
      height: 2.5px;
      background: #2c4b6b;
      border-radius: 4px;
    }

    .sidebar-content {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .sidebar.collapsed .sidebar-content {
      display: none;
    }

    @media (min-width: 768px) {
      .hamburger {
        display: none;
      }
      .sidebar.collapsed .sidebar-content {
        display: flex;
      }
      .sidebar-header {
        cursor: default;
        border-bottom: none;
        padding-bottom: 0;
      }
    }

    .stat-card {
      background: #f0f6fe;
      border-radius: 20px;
      padding: 18px;
    }

    .electron-count {
      font-size: 2.2rem;
      font-weight: 700;
      color: #1d4ed8;
      margin: 4px 0 12px;
    }

    .config-text {
      font-family: 'JetBrains Mono', 'Courier New', monospace;
      font-size: 0.85rem;
      background: #ffffff;
      padding: 10px;
      border-radius: 14px;
      margin: 8px 0 12px;
      word-break: break-word;
      border: 1px solid #dce9fc;
    }

    .status-badge {
      padding: 8px 14px;
      border-radius: 30px;
      font-weight: 600;
      font-size: 0.8rem;
      text-align: center;
      display: inline-block;
    }

    .noble {
      background: #d1fae5;
      color: #065f46;
    }

    .reactive {
      background: #fef3c7;
      color: #92400e;
    }

    .btn {
      width: 100%;
      padding: 12px;
      border-radius: 40px;
      border: 1.5px solid #d0e2ff;
      background: #ffffff;
      font-weight: 600;
      color: #1e3b5c;
      cursor: pointer;
      font-size: 0.9rem;
      transition: 0.2s;
    }

    .btn-primary {
      background: #2563eb;
      border-color: #2563eb;
      color: white;
    }

    .btn:hover {
      background: #f0f6ff;
    }

    .btn-primary:hover {
      background: #1d4ed8;
    }

    /* accordion for extra info */
    .accordion {
      border-top: 1px solid #e5eff9;
      padding-top: 6px;
    }

    .accordion-toggle {
      background: none;
      border: none;
      width: 100%;
      text-align: left;
      font-weight: 600;
      font-size: 0.85rem;
      color: #1e3b5c;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 0;
      cursor: pointer;
    }

    .accordion-content {
      font-size: 0.8rem;
      color: #43668c;
      display: none;
      padding-bottom: 6px;
    }

    .accordion.open .accordion-content {
      display: block;
    }
  </style>
</head>
<body>
<div class="dashboard">
  <!-- main orbital panel -->
  <div class="panel">
    <div class="panel-header">
      <h2>⚛️ electron configuration</h2>
      <div class="legend">
        <span>↑ spin up</span>
        <span>↓ spin down</span>
      </div>
    </div>
    <div class="stack" id="orbitalStack"></div>
  </div>

  <!-- sidebar -->
  <div class="sidebar" id="sidebar">
    <div class="panel">
      <div class="sidebar-header" id="sidebarToggleBtn">
        <h3>📊 telemetry</h3>
        <button class="hamburger" id="hamburgerIcon">
          <span></span><span></span><span></span>
        </button>
      </div>
      <div class="sidebar-content">
        <div class="stat-card">
          <div style="font-size:0.7rem; color:#43668c; text-transform:uppercase;">electrons</div>
          <div class="electron-count" id="eCount">0</div>
          <div style="font-size:0.7rem; color:#43668c; text-transform:uppercase;">configuration</div>
          <div class="config-text" id="configDisplay">—</div>
          <div id="statusDisplay" class="status-badge reactive">⚡ reactive</div>
        </div>

        <button class="btn" id="clearBtn">🗑️ clear</button>
        <button class="btn btn-primary" id="feBtn">Fe (26)</button>
        <button class="btn" id="krBtn">Kr (36)</button>

        <!-- accordion for noble gas info -->
        <div class="accordion" id="infoAccordion">
          <button class="accordion-toggle" id="accordionToggle">
            <span>✨ noble gas status</span>
            <span id="accordionArrow">▼</span>
          </button>
          <div class="accordion-content">
            Noble gases have fully filled shells (2, 10, 18, 36, 54, 86, 118 electrons).
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
  (function() {
    const subs = [
      { id: '1s', sz: 1 }, { id: '2s', sz: 1 }, { id: '2p', sz: 3 },
      { id: '3s', sz: 1 }, { id: '3p', sz: 3 }, { id: '4s', sz: 1 },
      { id: '3d', sz: 5 }, { id: '4p', sz: 3 }, { id: '5s', sz: 1 },
      { id: '4d', sz: 5 }
    ];

    let state = {};
    subs.forEach(s => state[s.id] = Array(s.sz).fill(0));

    const nobleSet = new Set([2, 10, 18, 36, 54, 86, 118]);
    const stackEl = document.getElementById('orbitalStack');
    const eCountEl = document.getElementById('eCount');
    const configDisplay = document.getElementById('configDisplay');
    const statusDisplay = document.getElementById('statusDisplay');

    // ---- sidebar collapse ----
    const sidebar = document.getElementById('sidebar');
    const sidebarToggleBtn = document.getElementById('sidebarToggleBtn');
    const hamburgerIcon = document.getElementById('hamburgerIcon');

    function isMobile() {
      return window.innerWidth < 768;
    }

    function toggleSidebar() {
      if (!isMobile()) return;
      sidebar.classList.toggle('collapsed');
    }

    sidebarToggleBtn.addEventListener('click', (e) => {
      if (e.target === hamburgerIcon || hamburgerIcon.contains(e.target) || e.target === sidebarToggleBtn || e.target.tagName === 'H3') {
        toggleSidebar();
      }
    });

    function handleResponsiveState() {
      if (isMobile()) {
        sidebar.classList.add('collapsed');
      } else {
        sidebar.classList.remove('collapsed');
      }
    }
    window.addEventListener('resize', handleResponsiveState);
    handleResponsiveState();

    // ---- accordion ----
    const infoAccordion = document.getElementById('infoAccordion');
    const accordionToggle = document.getElementById('accordionToggle');
    const accordionArrow = document.getElementById('accordionArrow');

    accordionToggle.addEventListener('click', () => {
      infoAccordion.classList.toggle('open');
      accordionArrow.textContent = infoAccordion.classList.contains('open') ? '▲' : '▼';
    });

    // ---- render orbitals ----
    function render() {
      stackEl.innerHTML = '';
      subs.forEach(s => {
        const row = document.createElement('div');
        row.className = 'subshell';

        const label = document.createElement('div');
        label.className = 'label';
        label.textContent = s.id;

        const boxesContainer = document.createElement('div');
        boxesContainer.className = 'boxes';
        boxesContainer.id = `b-${s.id}`;

        row.appendChild(label);
        row.appendChild(boxesContainer);
        stackEl.appendChild(row);

        for (let i = 0; i < s.sz; i++) {
          const box = document.createElement('div');
          box.className = 'box';
          box.addEventListener('click', () => handleClick(s.id, i));
          boxesContainer.appendChild(box);
        }
      });
      updateUI();
    }

    function handleClick(id, i) {
      const arr = state[id];
      const val = arr[i];
      if (val === 0) {
        arr[i] = 1;
      } else if (val === 1) {
        if (arr.some(x => x === 0)) {
          alert("Hund's Rule: Fill each orbital once before pairing.");
          return;
        }
        arr[i] = 2;
      } else {
        arr[i] = 0;
      }
      updateUI();
    }

    function updateUI() {
      let total = 0;
      let parts = [];

      subs.forEach(s => {
        const arr = state[s.id];
        let cnt = 0;
        const boxes = document.getElementById(`b-${s.id}`).children;

        arr.forEach((v, i) => {
          const box = boxes[i];
          box.innerHTML = '';
          if (v >= 1) {
            const up = document.createElement('span');
            up.className = 'arrow up';
            up.textContent = '↑';
            box.appendChild(up);
          }
          if (v === 2) {
            const down = document.createElement('span');
            down.className = 'arrow down';
            down.textContent = '↓';
            box.appendChild(down);
          }
          cnt += v;
        });

        total += cnt;
        if (cnt > 0) parts.push(`${s.id}${cnt}`);
      });

      eCountEl.textContent = total;
      configDisplay.textContent = parts.join(' · ') || '—';

      if (nobleSet.has(total)) {
        statusDisplay.textContent = '✨ noble';
        statusDisplay.className = 'status-badge noble';
      } else {
        statusDisplay.textContent = '⚡ reactive';
        statusDisplay.className = 'status-badge reactive';
      }
    }

    function clearAll() {
      Object.keys(state).forEach(k => state[k].fill(0));
      updateUI();
    }

    function aufbau(n) {
      clearAll();
      const order = ['1s', '2s', '2p', '3s', '3p', '4s', '3d', '4p', '5s', '4d'];
      let remaining = n;

      for (let id of order) {
        const arr = state[id];
        if (!arr) continue;
        for (let i = 0; i < arr.length && remaining > 0; i++) {
          if (remaining >= 2) {
            if (arr[i] === 0) { arr[i] = 1; remaining--; }
            if (arr[i] === 1) { arr[i] = 2; remaining--; }
          } else if (remaining === 1) {
            if (arr[i] === 0) { arr[i] = 1; remaining--; }
          }
        }
      }
      updateUI();
    }

    document.getElementById('clearBtn').addEventListener('click', clearAll);
    document.getElementById('feBtn').addEventListener('click', () => aufbau(26));
    document.getElementById('krBtn').addEventListener('click', () => aufbau(36));

    render();
  })();
</script>
</body>
</html>
