<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>⚛️ isotope builder</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      font-family: system-ui, sans-serif;
      background: #f8fcff;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 12px;
    }
    /* main layout container */
    .app {
      width: 100%;
      max-width: 1000px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      background: #fff;
      border-radius: 32px;
      box-shadow: 0 20px 40px rgba(0,20,40,0.08);
      padding: 16px;
      position: relative;
    }
    /* header with hamburger */
    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 8px 0 8px;
    }
    .logo {
      font-weight: 700;
      font-size: 1.4rem;
      color: #0a1e3c;
      letter-spacing: -0.3px;
    }
    .menu-btn {
      background: none;
      border: 1.5px solid #d0e2ff;
      border-radius: 40px;
      width: 44px;
      height: 44px;
      font-size: 1.6rem;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      background: #fff;
      color: #1e3a5f;
      transition: background 0.2s;
    }
    .menu-btn:active {
      background: #e8f0fe;
    }
    /* canvas container */
    .viz-panel {
      background: #fafcff;
      border-radius: 24px;
      border: 1px solid #d0e2ff;
      padding: 16px;
      box-shadow: 0 6px 18px rgba(0,0,0,0.03);
      display: flex;
      flex-direction: column;
    }
    canvas {
      display: block;
      width: 100%;
      aspect-ratio: 1/1;
      background: #ffffff;
      border-radius: 20px;
      border: 1px solid #dbeafe;
      margin: 8px 0;
    }
    .legend {
      display: flex;
      gap: 18px;
      font-size: 0.8rem;
      font-weight: 500;
      color: #334155;
      justify-content: center;
      padding-top: 6px;
    }
    /* sidebar overlay + panel */
    .sidebar {
      position: fixed;
      top: 0;
      right: 0;
      height: 100%;
      width: min(85vw, 360px);
      background: #ffffff;
      box-shadow: -8px 0 28px rgba(0,0,0,0.08);
      border-left: 1px solid #d0e2ff;
      transform: translateX(100%);
      transition: transform 0.25s ease;
      z-index: 1000;
      padding: 20px 16px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      overflow-y: auto;
      border-radius: 32px 0 0 32px;
    }
    .sidebar.open {
      transform: translateX(0);
    }
    .backdrop {
      position: fixed;
      inset: 0;
      background: rgba(10,20,40,0.2);
      backdrop-filter: blur(2px);
      z-index: 999;
      display: none;
    }
    .backdrop.show {
      display: block;
    }
    .close-btn {
      align-self: flex-end;
      background: none;
      border: 1.5px solid #d0e2ff;
      border-radius: 40px;
      width: 40px;
      height: 40px;
      font-size: 1.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      background: #fff;
      color: #0a1e3c;
    }
    /* controls inside sidebar */
    .ctrl-card {
      background: #f8fcff;
      border-radius: 24px;
      padding: 16px;
      border: 1px solid #e2e8f0;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .ctrl-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .ctrl-label {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 600;
      color: #1e293b;
    }
    .ctrl-btns {
      display: flex;
      gap: 10px;
      align-items: center;
    }
    .btn {
      width: 42px;
      height: 42px;
      border-radius: 42px;
      border: 1.5px solid #d0e2ff;
      background: #fff;
      font-size: 1.4rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s;
    }
    .btn:active {
      background: #f0f4ff;
      transform: scale(0.96);
    }
    .btn-p { color: #ef4444; }
    .btn-n { color: #3b82f6; }
    .btn-e { color: #10b981; }
    .counter {
      min-width: 28px;
      text-align: center;
      font-weight: 700;
      font-size: 1.1rem;
    }
    /* isotope summary */
    .isotope-card {
      background: #f0f6ff;
      border-radius: 20px;
      padding: 16px;
      text-align: center;
      margin-top: 8px;
    }
    .symbol {
      font-size: 3.2rem;
      font-weight: 800;
      color: #2563eb;
      line-height: 1;
    }
    .stats {
      display: flex;
      justify-content: center;
      gap: 24px;
      margin: 10px 0 4px;
      font-weight: 500;
      color: #1e3a5f;
    }
    .warning {
      background: #fef3c7;
      color: #92400e;
      padding: 8px;
      border-radius: 24px;
      font-size: 0.8rem;
      font-weight: 600;
      margin-top: 12px;
      display: none;
      border: 1px solid #fcd34d;
    }
    .warning.show {
      display: block;
    }
    /* tabs / accordion style for additional info */
    .accordion {
      background: #f8fcff;
      border-radius: 20px;
      border: 1px solid #d0e2ff;
      overflow: hidden;
    }
    .accordion-header {
      padding: 12px 16px;
      font-weight: 600;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #ffffff;
      cursor: pointer;
      border-bottom: 1px solid transparent;
    }
    .accordion-header.active {
      border-bottom: 1px solid #d0e2ff;
    }
    .accordion-content {
      display: none;
      padding: 12px 16px;
      font-size: 0.9rem;
      color: #334155;
      background: #fafcff;
    }
    .accordion-content.open {
      display: block;
    }
    .desc-text {
      font-size: 0.85rem;
      color: #475569;
      line-height: 1.4;
    }
    @media (min-width: 700px) {
      .app {
        flex-direction: row;
        padding: 20px;
      }
      .viz-panel {
        flex: 2;
      }
      .sidebar {
        position: static;
        transform: none;
        width: auto;
        flex: 1.2;
        box-shadow: none;
        border-left: none;
        border-radius: 24px;
        background: transparent;
        padding: 0;
        height: auto;
        overflow-y: visible;
      }
      .backdrop {
        display: none !important;
      }
      .close-btn {
        display: none;
      }
      .menu-btn {
        display: none;
      }
    }
  </style>
</head>
<body>
<div class="app">
  <div class="top-bar">
    <div class="logo">⚛️ atomic architect</div>
    <button class="menu-btn" id="menuToggle" aria-label="Open controls">☰</button>
  </div>

  <!-- visualization always visible -->
  <div class="viz-panel">
    <canvas id="atomCanvas"></canvas>
    <div class="legend">
      <span style="color:#ef4444">● proton</span>
      <span style="color:#3b82f6">● neutron</span>
      <span style="color:#10b981">● electron</span>
    </div>
  </div>

  <!-- sidebar (controls) -->
  <div class="sidebar" id="sidebar">
    <button class="close-btn" id="closeSidebar" aria-label="Close controls">✕</button>

    <div class="ctrl-card">
      <div class="ctrl-row">
        <span class="ctrl-label"><span style="color:#ef4444">●</span> protons</span>
        <div class="ctrl-btns">
          <button class="btn btn-p" id="pDown">−</button>
          <span class="counter" id="pCount">1</span>
          <button class="btn btn-p" id="pUp">+</button>
        </div>
      </div>
      <div class="ctrl-row">
        <span class="ctrl-label"><span style="color:#3b82f6">●</span> neutrons</span>
        <div class="ctrl-btns">
          <button class="btn btn-n" id="nDown">−</button>
          <span class="counter" id="nCount">0</span>
          <button class="btn btn-n" id="nUp">+</button>
        </div>
      </div>
      <div class="ctrl-row">
        <span class="ctrl-label"><span style="color:#10b981">●</span> electrons</span>
        <div class="ctrl-btns">
          <button class="btn btn-e" id="eDown">−</button>
          <span class="counter" id="eCount">1</span>
          <button class="btn btn-e" id="eUp">+</button>
        </div>
      </div>

      <div class="isotope-card">
        <div id="isotopeName" style="font-weight:700">Hydrogen-1</div>
        <div class="symbol" id="symbol">H</div>
        <div class="stats">
          <div>mass <span id="massNum">1</span></div>
          <div>charge <span id="charge">0</span></div>
        </div>
        <div class="warning" id="warning">⚠️ unstable · n/p ratio off</div>
      </div>
    </div>

    <!-- interactive accordion for details -->
    <div class="accordion">
      <div class="accordion-header" id="accordionHeader">
        <span>📘 isotope details</span>
        <span style="font-size:1.2rem;">▾</span>
      </div>
      <div class="accordion-content" id="accordionContent">
        <div class="desc-text" id="detailText">
          Hydrogen-1 is the most common isotope of hydrogen, with one proton and no neutrons.
        </div>
      </div>
    </div>
  </div>
  <div class="backdrop" id="backdrop"></div>
</div>

<script>
  (function() {
    const canvas = document.getElementById('atomCanvas');
    const ctx = canvas.getContext('2d');
    let w = 0, h = 0, DPR = devicePixelRatio || 1;
    let p = 1, n = 0, e = 1, time = 0;
    const elements = ["", "H", "He", "Li", "Be", "B", "C", "N", "O", "F", "Ne", "Na", "Mg"];

    // UI elements
    const pCount = document.getElementById('pCount');
    const nCount = document.getElementById('nCount');
    const eCount = document.getElementById('eCount');
    const isotopeName = document.getElementById('isotopeName');
    const symbol = document.getElementById('symbol');
    const massNum = document.getElementById('massNum');
    const charge = document.getElementById('charge');
    const warning = document.getElementById('warning');
    const detailText = document.getElementById('detailText');

    // Sidebar toggle
    const sidebar = document.getElementById('sidebar');
    const backdrop = document.getElementById('backdrop');
    const menuToggle = document.getElementById('menuToggle');
    const closeSidebar = document.getElementById('closeSidebar');

    function openSidebar() {
      sidebar.classList.add('open');
      backdrop.classList.add('show');
    }
    function closeSidebarFn() {
      sidebar.classList.remove('open');
      backdrop.classList.remove('show');
    }
    menuToggle.addEventListener('click', openSidebar);
    closeSidebar.addEventListener('click', closeSidebarFn);
    backdrop.addEventListener('click', closeSidebarFn);

    // Accordion
    const accordionHeader = document.getElementById('accordionHeader');
    const accordionContent = document.getElementById('accordionContent');
    accordionHeader.addEventListener('click', () => {
      accordionContent.classList.toggle('open');
      accordionHeader.classList.toggle('active');
    });
    // open by default on desktop
    if (window.innerWidth >= 700) {
      accordionContent.classList.add('open');
      accordionHeader.classList.add('active');
    }

    function resize() {
      const rect = canvas.parentElement.getBoundingClientRect();
      w = rect.width;
      h = w; 
      canvas.width = w * DPR;
      canvas.height = h * DPR;
      canvas.style.width = w + 'px';
      canvas.style.height = h + 'px';
      ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    }

    function updateUI() {
      pCount.textContent = p;
      nCount.textContent = n;
      eCount.textContent = e;
      const sym = elements[p] || '?';
      symbol.textContent = sym;
      const mass = p + n;
      isotopeName.textContent = `${sym}-${mass}`;
      massNum.textContent = mass;
      charge.textContent = p - e;
      const ratio = n / p;
      const unstable = p > 1 && (ratio < 0.6 || ratio > 1.6);
      warning.classList.toggle('show', unstable);

      // concise detail text
      let detail = `${sym}-${mass}: ${p} proton${p>1?'s':''}, ${n} neutron${n>1?'s':''}. `;
      if (unstable) detail += 'Unstable isotope.';
      else if (p === 1 && n === 0) detail += 'Most abundant hydrogen isotope.';
      else detail += 'Stable configuration.';
      detailText.textContent = detail;
    }

    function draw() {
      ctx.clearRect(0, 0, w, h);
      const cx = w / 2, cy = h / 2;
      const total = p + n;
      const ratio = n / p;
      const unstable = p > 1 && (ratio < 0.6 || ratio > 1.6);
      const shake = unstable ? Math.sin(time * 8) * 2 : 0;
      time += 0.015;

      // nucleus glow
      ctx.beginPath();
      ctx.arc(cx + shake, cy + shake, 38, 0, 2 * Math.PI);
      ctx.fillStyle = '#3b82f610';
      ctx.fill();

      for (let i = 0; i < total; i++) {
        const angle = (i / total) * 2 * Math.PI + time * 0.01;
        const rad = 12 + (i % 3) * 7;
        const x = cx + Math.cos(angle) * rad + shake;
        const y = cy + Math.sin(angle) * rad + shake;
        ctx.beginPath();
        ctx.arc(x, y, 6, 0, 2 * Math.PI);
        ctx.fillStyle = i < p ? '#ef4444' : '#3b82f6';
        ctx.shadowColor = i < p ? '#ef444480' : '#3b82f680';
        ctx.shadowBlur = 10;
        ctx.fill();
      }
      ctx.shadowBlur = 0;

      for (let i = 0; i < e; i++) {
        const shell = Math.floor(i / 2) + 1;
        const rad = 48 + shell * 24;
        const spd = (i % 2 === 0 ? time : time * 0.8) * (1 / shell);
        const ex = cx + Math.cos(spd + i) * rad;
        const ey = cy + Math.sin(spd + i) * rad;
        ctx.beginPath();
        ctx.arc(cx, cy, rad, 0, 2 * Math.PI);
        ctx.strokeStyle = '#10b98130';
        ctx.lineWidth = 1.5;
        ctx.setLineDash([3, 6]);
        ctx.stroke();
        ctx.setLineDash([]);
        ctx.beginPath();
        ctx.arc(ex, ey, 4, 0, 2 * Math.PI);
        ctx.fillStyle = '#10b981';
        ctx.shadowColor = '#10b98180';
        ctx.shadowBlur = 8;
        ctx.fill();
      }
      ctx.shadowBlur = 0;
      requestAnimationFrame(draw);
    }

    function change(type, d) {
      if (type === 'p') p = Math.max(1, Math.min(12, p + d));
      else if (type === 'n') n = Math.max(0, Math.min(14, n + d));
      else e = Math.max(0, Math.min(12, e + d));
      updateUI();
    }

    document.getElementById('pUp').onclick = () => change('p', 1);
    document.getElementById('pDown').onclick = () => change('p', -1);
    document.getElementById('nUp').onclick = () => change('n', 1);
    document.getElementById('nDown').onclick = () => change('n', -1);
    document.getElementById('eUp').onclick = () => change('e', 1);
    document.getElementById('eDown').onclick = () => change('e', -1);

    window.addEventListener('resize', resize);
    resize();
    updateUI();
    draw();

    // close sidebar on desktop resize if needed
    window.addEventListener('resize', () => {
      if (window.innerWidth >= 700) {
        closeSidebarFn();
      }
    });
  })();
</script>
</body>
</html>
