<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>☁️ 1s probability cloud</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      background: #f5f9ff;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 12px;
    }

    .dashboard {
      display: grid;
      grid-template-columns: 1fr;
      gap: 16px;
      width: 100%;
      max-width: 950px;
      margin: 0 auto;
    }

    @media (min-width: 768px) {
      .dashboard {
        grid-template-columns: 1fr 260px;
        align-items: start;
      }
    }

    /* canvas panel */
    .canvas-panel {
      background: #ffffff;
      border-radius: 28px;
      border: 1px solid #d9e9ff;
      box-shadow: 0 12px 30px rgba(0, 20, 50, 0.06);
      padding: 16px;
      display: flex;
      flex-direction: column;
    }

    .panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      padding: 0 4px;
    }

    .panel-header h2 {
      font-weight: 600;
      font-size: 1.3rem;
      color: #0b2b4f;
      letter-spacing: -0.3px;
    }

    .legend {
      display: flex;
      gap: 18px;
      font-size: 0.8rem;
      font-weight: 500;
      color: #2c4b6b;
    }

    canvas {
      display: block;
      width: 100%;
      aspect-ratio: 1 / 1;
      background: #ffffff;
      border-radius: 20px;
      border: 1px solid #d4e3fc;
      touch-action: none;
    }

    /* sidebar */
    .sidebar {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .sidebar-panel {
      background: #ffffff;
      border-radius: 24px;
      border: 1px solid #d9e9ff;
      box-shadow: 0 12px 30px rgba(0, 20, 50, 0.06);
      overflow: hidden;
    }

    .sidebar-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 18px;
      cursor: pointer;
      user-select: none;
      border-bottom: 1px solid #e9f0fa;
    }

    .sidebar-header h3 {
      font-weight: 600;
      font-size: 1rem;
      color: #0b2b4f;
    }

    .hamburger {
      display: flex;
      flex-direction: column;
      gap: 5px;
      background: none;
      border: none;
      padding: 6px;
      cursor: pointer;
    }

    .hamburger span {
      display: block;
      width: 20px;
      height: 2.5px;
      background: #2c4b6b;
      border-radius: 4px;
    }

    .sidebar-content {
      padding: 16px 18px 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .sidebar.collapsed .sidebar-content {
      display: none;
    }

    @media (min-width: 768px) {
      .hamburger {
        display: none;
      }
      .sidebar.collapsed .sidebar-content {
        display: flex;
      }
      .sidebar-header {
        cursor: default;
        border-bottom: none;
        padding-bottom: 0;
      }
    }

    .btn {
      width: 100%;
      padding: 13px;
      border-radius: 40px;
      border: none;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      transition: 0.2s;
      background: #2563eb;
      color: white;
    }

    .btn:hover {
      background: #1d4ed8;
    }

    .btn-outline {
      background: #ffffff;
      border: 1.5px solid #d0e2ff;
      color: #1e3b5c;
    }

    .btn-outline:hover {
      background: #f0f6ff;
    }

    .stat-card {
      background: #f0f6fe;
      border-radius: 18px;
      padding: 16px;
    }

    .stat-row {
      display: flex;
      justify-content: space-between;
      padding: 6px 0;
      font-size: 0.9rem;
      color: #1e3b5c;
      font-weight: 500;
    }

    .stat-value {
      font-weight: 700;
      color: #2563eb;
    }

    /* accordion */
    .accordion {
      border-top: 1px solid #e5eff9;
      padding-top: 6px;
    }

    .accordion-toggle {
      background: none;
      border: none;
      width: 100%;
      text-align: left;
      font-weight: 600;
      font-size: 0.85rem;
      color: #1e3b5c;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 0;
      cursor: pointer;
    }

    .accordion-content {
      font-size: 0.8rem;
      color: #43668c;
      display: none;
      padding-bottom: 6px;
      line-height: 1.4;
    }

    .accordion.open .accordion-content {
      display: block;
    }
  </style>
</head>
<body>
<div class="dashboard">
  <!-- canvas panel -->
  <div class="canvas-panel">
    <div class="panel-header">
      <h2>☁️ 1s probability density</h2>
      <div class="legend">
        <span style="color:#ef4444;">● nucleus</span>
        <span style="color:#2563eb;">● measurement</span>
      </div>
    </div>
    <canvas id="cloudCanvas"></canvas>
  </div>

  <!-- sidebar -->
  <div class="sidebar" id="sidebar">
    <div class="sidebar-panel">
      <div class="sidebar-header" id="sidebarToggleBtn">
        <h3>📊 controls</h3>
        <button class="hamburger" id="hamburgerIcon">
          <span></span><span></span><span></span>
        </button>
      </div>
      <div class="sidebar-content">
        <button class="btn" id="measure100">📊 measure ×100</button>
        <button class="btn" id="measure500" style="background:#60a5fa;">📊 measure ×500</button>
        <button class="btn btn-outline" id="clearBtn">🗑️ clear all</button>

        <div class="stat-card">
          <div class="stat-row">
            <span>measurements</span>
            <span class="stat-value" id="countDisp">0</span>
          </div>
          <div class="stat-row">
            <span>avg radius</span>
            <span class="stat-value" id="avgDisp">0</span>
          </div>
        </div>

        <!-- accordion for explanation -->
        <div class="accordion" id="infoAccordion">
          <button class="accordion-toggle" id="accordionToggle">
            <span>📘 wavefunction</span>
            <span id="accordionArrow">▼</span>
          </button>
          <div class="accordion-content">
            ψ₁ₛ ∝ e⁻ʳ · denser cloud = higher probability near nucleus.
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
  (function() {
    const canvas = document.getElementById('cloudCanvas');
    const ctx = canvas.getContext('2d');

    let w = 0, h = 0;
    const DPR = devicePixelRatio || 1;
    let points = [];

    const countDisplay = document.getElementById('countDisp');
    const avgDisplay = document.getElementById('avgDisp');

    // ---- sidebar collapse ----
    const sidebar = document.getElementById('sidebar');
    const sidebarToggleBtn = document.getElementById('sidebarToggleBtn');
    const hamburgerIcon = document.getElementById('hamburgerIcon');

    function isMobile() {
      return window.innerWidth < 768;
    }

    function toggleSidebar() {
      if (!isMobile()) return;
      sidebar.classList.toggle('collapsed');
    }

    sidebarToggleBtn.addEventListener('click', (e) => {
      if (e.target === hamburgerIcon || hamburgerIcon.contains(e.target) || e.target === sidebarToggleBtn || e.target.tagName === 'H3') {
        toggleSidebar();
      }
    });

    function handleResponsiveState() {
      if (isMobile()) {
        sidebar.classList.add('collapsed');
      } else {
        sidebar.classList.remove('collapsed');
      }
    }
    window.addEventListener('resize', handleResponsiveState);
    handleResponsiveState();

    // ---- accordion ----
    const infoAccordion = document.getElementById('infoAccordion');
    const accordionToggle = document.getElementById('accordionToggle');
    const accordionArrow = document.getElementById('accordionArrow');

    accordionToggle.addEventListener('click', () => {
      infoAccordion.classList.toggle('open');
      accordionArrow.textContent = infoAccordion.classList.contains('open') ? '▲' : '▼';
    });

    // ---- canvas resize ----
    function resizeCanvas() {
      const container = canvas.parentElement;
      const rect = container.getBoundingClientRect();
      w = rect.width;
      h = w; // square aspect ratio
      canvas.width = w * DPR;
      canvas.height = h * DPR;
      canvas.style.width = w + 'px';
      canvas.style.height = h + 'px';
      ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    }

    // ---- gaussian random for radial distribution ----
    function gaussianRandom() {
      let u = 0, v = 0;
      while (u === 0) u = Math.random();
      while (v === 0) v = Math.random();
      return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
    }

    function measure(n) {
      const cx = w / 2;
      const cy = h / 2;
      const scale = Math.min(w, h) * 0.22;

      for (let i = 0; i < n; i++) {
        const r = Math.abs(gaussianRandom() * scale * 0.5);
        const theta = Math.random() * 2 * Math.PI;
        points.push({
          x: cx + r * Math.cos(theta),
          y: cy + r * Math.sin(theta),
          r: r
        });
      }
      updateStats();
      draw();
    }

    function updateStats() {
      countDisplay.textContent = points.length;
      if (points.length > 0) {
        const avgRadius = points.reduce((sum, p) => sum + p.r, 0) / points.length;
        avgDisplay.textContent = (avgRadius / (w * 0.01)).toFixed(1);
      } else {
        avgDisplay.textContent = '0';
      }
    }

    function draw() {
      ctx.clearRect(0, 0, w, h);
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, w, h);

      const cx = w / 2;
      const cy = h / 2;

      // probability rings
      ctx.strokeStyle = '#d0e2ff';
      ctx.lineWidth = 1.2;
      ctx.setLineDash([3, 6]);
      for (let r = w * 0.1; r < w * 0.48; r += w * 0.1) {
        ctx.beginPath();
        ctx.arc(cx, cy, r, 0, 2 * Math.PI);
        ctx.stroke();
      }
      ctx.setLineDash([]);

      // nucleus
      ctx.beginPath();
      ctx.arc(cx, cy, 5, 0, 2 * Math.PI);
      ctx.fillStyle = '#ef4444';
      ctx.shadowColor = '#ef444480';
      ctx.shadowBlur = 12;
      ctx.fill();
      ctx.shadowBlur = 0;

      // measurement points
      points.forEach(p => {
        ctx.fillStyle = `rgba(37, 99, 235, ${0.25 + Math.random() * 0.15})`;
        ctx.beginPath();
        ctx.arc(p.x, p.y, 2.2, 0, 2 * Math.PI);
        ctx.fill();
      });

      // radial gradient overlay
      const gradient = ctx.createRadialGradient(cx, cy, 0, cx, cy, w * 0.24);
      gradient.addColorStop(0, '#3b82f620');
      gradient.addColorStop(1, '#3b82f600');
      ctx.fillStyle = gradient;
      ctx.beginPath();
      ctx.arc(cx, cy, w * 0.24, 0, 2 * Math.PI);
      ctx.fill();
    }

    function clearPoints() {
      points = [];
      updateStats();
      draw();
    }

    document.getElementById('measure100').addEventListener('click', () => measure(100));
    document.getElementById('measure500').addEventListener('click', () => measure(500));
    document.getElementById('clearBtn').addEventListener('click', clearPoints);

    window.addEventListener('resize', () => {
      resizeCanvas();
      draw();
    });

    resizeCanvas();
    draw();
  })();
</script>
</body>
</html>
