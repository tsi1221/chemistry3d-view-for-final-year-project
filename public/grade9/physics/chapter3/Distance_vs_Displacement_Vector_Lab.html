<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Distance vs Displacement · Vector Lab</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
        
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            margin: 0;
            padding: 0;
        }
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            height: 100dvh;
            background: #fafbfc;
            overflow: hidden;
            touch-action: pan-y;
            color: #1a1e2b;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
        }
        
        /* Header */
        .app-header {
            padding: 16px 24px;
            background: #ffffff;
            border-bottom: 1px solid #eef2f6;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
            gap: 12px;
            position: relative;
            z-index: 20;
        }
        
        .app-title {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }
        
        .app-title h1 {
            font-size: 1.4rem;
            font-weight: 600;
            letter-spacing: -0.02em;
            color: #1a1e2b;
            white-space: nowrap;
        }
        
        .app-title .badge {
            background: #eef2f6;
            color: #5b687c;
            font-size: 0.75rem;
            font-weight: 600;
            padding: 4px 10px;
            border-radius: 20px;
            text-transform: uppercase;
            letter-spacing: 0.3px;
            white-space: nowrap;
        }
        
        /* Stats Bar */
        .stats-bar {
            padding: 16px 24px;
            background: #ffffff;
            border-bottom: 1px solid #eef2f6;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 40px;
            flex-shrink: 0;
            flex-wrap: wrap;
        }
        
        .stat-box {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .stat-icon {
            width: 40px;
            height: 40px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            flex-shrink: 0;
        }
        
        .stat-content {
            display: flex;
            flex-direction: column;
        }
        
        .stat-label {
            font-size: 0.75rem;
            font-weight: 600;
            color: #7c879c;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            white-space: nowrap;
        }
        
        .stat-value {
            font-size: 1.8rem;
            font-weight: 700;
            font-family: 'SF Mono', 'Menlo', 'Monaco', 'Cascadia Code', 'Consolas', monospace;
        }
        
        #dist-val, #mobile-dist-val {
            color: #e67e22;
        }
        
        #disp-val, #mobile-disp-val {
            color: #3b82f6;
        }
        
        /* Main Simulation Area */
        .simulation-container {
            flex-grow: 1;
            background: #fafbfc;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            touch-action: none;
            min-height: 0;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }
        
        .canvas-card {
            position: relative;
            width: 100%;
            max-width: 1000px;
            background: #ffffff;
            border-radius: 24px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.04), 0 1px 2px rgba(0, 0, 0, 0.05);
            border: 1px solid #eef2f6;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        
        .canvas-wrapper {
            position: relative;
            width: 100%;
            aspect-ratio: 2 / 1;
            min-height: 200px;
        }
        
        #vectorCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: block;
            touch-action: none;
            cursor: crosshair;
        }
        
        /* Controls */
        .controls-bar {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 16px;
            padding: 16px 24px;
            background: #ffffff;
            border-top: 1px solid #eef2f6;
            flex-wrap: wrap;
        }
        
        .control-btn {
            padding: 12px 28px;
            border-radius: 40px;
            border: none;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.2s ease;
            touch-action: manipulation;
            display: flex;
            align-items: center;
            gap: 8px;
            -webkit-tap-highlight-color: transparent;
            min-height: 44px;
            white-space: nowrap;
        }
        
        .control-btn.primary {
            background: #10b981;
            color: white;
        }
        
        .control-btn.primary:hover {
            background: #059669;
        }
        
        .control-btn:active {
            transform: scale(0.97);
        }
        
        .control-btn.secondary {
            background: #f5f7fa;
            color: #5b687c;
            border: 1px solid #eef2f6;
        }
        
        .control-btn.secondary:hover {
            background: #eef2f6;
        }
        
        /* Hint */
        .hint-wrapper {
            padding: 12px 24px 16px 24px;
            text-align: center;
            background: #ffffff;
            border-top: 1px solid #eef2f6;
        }
        
        .hint-text {
            display: inline-block;
            padding: 8px 20px;
            background: #f5f7fa;
            border-radius: 40px;
            font-size: 0.85rem;
            color: #5b687c;
            border: 1px solid #eef2f6;
            max-width: 100%;
            word-break: break-word;
        }
        
        .hint-text span {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            flex-wrap: wrap;
            justify-content: center;
        }
        
        .color-dot {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            margin: 0 4px;
            flex-shrink: 0;
        }
        
        /* Hamburger Menu Button */
        .hamburger-btn {
            display: none;
            width: 44px;
            height: 44px;
            min-width: 44px;
            min-height: 44px;
            border-radius: 12px;
            background: #ffffff;
            border: 1px solid #eef2f6;
            color: #1a1e2b;
            font-size: 1.5rem;
            cursor: pointer;
            align-items: center;
            justify-content: center;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
            flex-shrink: 0;
            z-index: 101;
            position: relative;
        }
        
        .hamburger-btn .icon {
            display: block;
            width: 20px;
            height: 2px;
            background: #1a1e2b;
            position: relative;
            transition: all 0.3s;
            border-radius: 1px;
        }
        
        .hamburger-btn .icon::before,
        .hamburger-btn .icon::after {
            content: '';
            display: block;
            width: 20px;
            height: 2px;
            background: #1a1e2b;
            position: absolute;
            left: 0;
            transition: all 0.3s;
            border-radius: 1px;
        }
        
        .hamburger-btn .icon::before {
            top: -6px;
        }
        
        .hamburger-btn .icon::after {
            top: 6px;
        }
        
        .hamburger-btn.open .icon {
            background: transparent;
        }
        
        .hamburger-btn.open .icon::before {
            top: 0;
            transform: rotate(45deg);
        }
        
        .hamburger-btn.open .icon::after {
            top: 0;
            transform: rotate(-45deg);
        }
        
        /* Mobile Menu Overlay */
        .mobile-menu-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.2);
            z-index: 98;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s;
        }
        
        .mobile-menu-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }
        
        /* Mobile Menu Panel */
        .mobile-menu {
            display: block;
            position: fixed;
            top: 0;
            right: -100%;
            width: 340px;
            max-width: 90vw;
            height: 100vh;
            height: 100dvh;
            background: #ffffff;
            z-index: 99;
            pointer-events: auto;
            box-shadow: -4px 0 30px rgba(0, 0, 0, 0.08);
            transition: right 0.3s ease;
            overflow-y: auto;
            padding: 20px;
            -webkit-overflow-scrolling: touch;
        }
        
        .mobile-menu.open {
            right: 0;
        }
        
        .mobile-menu-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            padding-bottom: 16px;
            border-bottom: 1px solid #eef2f6;
        }
        
        .mobile-menu-title {
            font-size: 1rem;
            font-weight: 600;
            color: #1a1e2b;
            letter-spacing: -0.02em;
        }
        
        .mobile-menu-close {
            width: 36px;
            height: 36px;
            min-width: 36px;
            min-height: 36px;
            border-radius: 10px;
            background: transparent;
            border: 1px solid #eef2f6;
            color: #1a1e2b;
            font-size: 1.2rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
            transition: all 0.2s;
            flex-shrink: 0;
        }
        
        .mobile-menu-close:hover {
            background: #f5f7fa;
        }
        
        .mobile-menu-section {
            margin-bottom: 20px;
        }
        
        .mobile-menu-label {
            font-size: 0.7rem;
            font-weight: 600;
            color: #7c879c;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 10px;
        }
        
        .mobile-menu .stat-box {
            margin-bottom: 12px;
        }
        
        .mobile-menu .stat-value {
            font-size: 1.5rem;
        }
        
        .mobile-menu .control-btn {
            width: 100%;
            justify-content: center;
            margin-bottom: 8px;
            font-size: 0.85rem;
            padding: 14px 20px;
        }
        
        .mobile-menu .hint-text {
            display: block;
            text-align: center;
            font-size: 0.75rem;
            padding: 10px 16px;
        }
        
        /* Responsive Breakpoints */
        @media (max-width: 768px) {
            .app-header {
                padding: 12px 16px;
            }
            
            .app-title h1 {
                font-size: 1.1rem;
            }
            
            .stats-bar {
                display: none;
            }
            
            .controls-bar {
                display: none;
            }
            
            .hint-wrapper {
                display: none;
            }
            
            .hamburger-btn {
                display: flex;
            }
            
            .mobile-menu-overlay {
                display: block;
            }
            
            .simulation-container {
                padding: 12px;
            }
            
            .canvas-card {
                border-radius: 18px;
            }
            
            .canvas-wrapper {
                aspect-ratio: 1.5 / 1;
                min-height: 180px;
            }
        }
        
        @media (min-width: 769px) {
            .mobile-menu {
                right: -100% !important;
            }
            .mobile-menu-overlay {
                opacity: 0 !important;
                pointer-events: none !important;
            }
            .hamburger-btn {
                display: none !important;
            }
        }
        
        @media (max-width: 480px) {
            .app-header {
                padding: 10px 12px;
            }
            
            .app-title h1 {
                font-size: 1rem;
            }
            
            .app-title .badge {
                font-size: 0.65rem;
                padding: 3px 8px;
            }
            
            .simulation-container {
                padding: 8px;
            }
            
            .canvas-card {
                border-radius: 14px;
            }
            
            .canvas-wrapper {
                aspect-ratio: 1.3 / 1;
                min-height: 160px;
            }
            
            .mobile-menu {
                width: 100%;
                max-width: 100vw;
                padding: 16px;
            }
            
            .mobile-menu .stat-value {
                font-size: 1.3rem;
            }
            
            .mobile-menu .control-btn {
                font-size: 0.8rem;
                padding: 12px 16px;
            }
        }
        
        /* Tablet landscape optimization */
        @media (min-width: 769px) and (max-width: 1024px) {
            .stats-bar {
                gap: 24px;
            }
            
            .stat-value {
                font-size: 1.5rem;
            }
            
            .control-btn {
                padding: 10px 20px;
                font-size: 0.85rem;
            }
        }
        
        /* Prevent pull-to-refresh */
        html, body {
            overscroll-behavior: none;
        }
        
        button:focus-visible {
            outline: 2px solid #0066cc;
            outline-offset: 2px;
        }
    </style>
</head>
<body>
    <header class="app-header">
        <div class="app-title">
            <h1>📐 Distance vs Displacement</h1>
            <span class="badge">Vector Lab</span>
        </div>
        <!-- Hamburger Menu Button -->
        <button class="hamburger-btn" id="hamburgerBtn" aria-label="Open menu" aria-expanded="false">
            <span class="icon"></span>
        </button>
    </header>

    <div class="stats-bar" id="desktopStats">
        <div class="stat-box">
            <div class="stat-icon" style="background: #fff3e0;">
                <span style="color: #e67e22;">🧵</span>
            </div>
            <div class="stat-content">
                <span class="stat-label">Distance (Scalar)</span>
                <span class="stat-value" id="dist-val">0</span>
            </div>
        </div>
        <div class="stat-box">
            <div class="stat-icon" style="background: #dbeafe;">
                <span style="color: #3b82f6;">➡️</span>
            </div>
            <div class="stat-content">
                <span class="stat-label">Displacement (Vector)</span>
                <span class="stat-value" id="disp-val">0</span>
            </div>
        </div>
    </div>

    <!-- Mobile Menu Overlay -->
    <div class="mobile-menu-overlay" id="mobileMenuOverlay"></div>

    <!-- Mobile Menu Panel -->
    <div class="mobile-menu" id="mobileMenu" role="dialog" aria-label="Lab controls and stats">
        <div class="mobile-menu-header">
            <div class="mobile-menu-title">📐 Vector Lab</div>
            <button class="mobile-menu-close" id="mobileMenuClose" aria-label="Close menu">✕</button>
        </div>

        <div class="mobile-menu-section">
            <div class="mobile-menu-label">Measurements</div>
            <div class="stat-box">
                <div class="stat-icon" style="background: #fff3e0;">
                    <span style="color: #e67e22;">🧵</span>
                </div>
                <div class="stat-content">
                    <span class="stat-label">Distance (Scalar)</span>
                    <span class="stat-value" id="mobile-dist-val">0</span>
                </div>
            </div>
            <div class="stat-box">
                <div class="stat-icon" style="background: #dbeafe;">
                    <span style="color: #3b82f6;">➡️</span>
                </div>
                <div class="stat-content">
                    <span class="stat-label">Displacement (Vector)</span>
                    <span class="stat-value" id="mobile-disp-val">0</span>
                </div>
            </div>
        </div>

        <div class="mobile-menu-section">
            <div class="mobile-menu-label">Actions</div>
            <button class="control-btn primary" id="mobileStraightenBtn">
                <span>📏</span> Straighten & Compare
            </button>
            <button class="control-btn secondary" id="mobileClearBtn">
                <span>🗑️</span> Clear Path
            </button>
        </div>

        <div class="mobile-menu-section">
            <div class="hint-text">
                <span>
                    <span class="color-dot" style="background: #e67e22;"></span> Draw winding path
                    <span class="color-dot" style="background: #3b82f6; margin-left: 16px;"></span> Direct displacement
                </span>
            </div>
        </div>
    </div>

    <div class="simulation-container">
        <div class="canvas-card">
            <div class="canvas-wrapper">
                <canvas id="vectorCanvas" width="1000" height="500"></canvas>
            </div>
            
            <!-- Controls (Desktop) -->
            <div class="controls-bar" id="desktopControls">
                <button class="control-btn primary" id="straightenBtn">
                    <span>📏</span> Straighten & Compare
                </button>
                <button class="control-btn secondary" id="clearBtn">
                    <span>🗑️</span> Clear Path
                </button>
            </div>
            
            <!-- Hint (Desktop) -->
            <div class="hint-wrapper" id="desktopHint">
                <div class="hint-text">
                    <span>
                        <span class="color-dot" style="background: #e67e22;"></span> Draw winding path
                        <span class="color-dot" style="background: #3b82f6; margin-left: 16px;"></span> Direct displacement
                    </span>
                </div>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('vectorCanvas');
        const ctx = canvas.getContext('2d');
        
        // Desktop elements
        const distLabel = document.getElementById('dist-val');
        const dispLabel = document.getElementById('disp-val');
        
        // Mobile elements
        const mobileDistLabel = document.getElementById('mobile-dist-val');
        const mobileDispLabel = document.getElementById('mobile-disp-val');
        
        // Mobile menu elements
        const hamburgerBtn = document.getElementById('hamburgerBtn');
        const mobileMenu = document.getElementById('mobileMenu');
        const mobileMenuOverlay = document.getElementById('mobileMenuOverlay');
        const mobileMenuClose = document.getElementById('mobileMenuClose');
        
        // Canvas internal dimensions
        const width = 1000;
        const height = 500;
        
        function resizeCanvas() {
            canvas.width = width;
            canvas.height = height;
        }
        
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        let path = [];
        let isDrawing = false;
        let isStraightened = false;
        let straightenedAnim = 0;

        function clearLab() {
            path = [];
            isStraightened = false;
            straightenedAnim = 0;
            updateLabels(0, 0);
        }

        function straightenThread() {
            if (path.length < 2) return;
            isStraightened = true;
        }
        
        function updateLabels(distance, displacement) {
            const distStr = Math.round(distance).toString();
            const dispStr = Math.round(displacement).toString();
            if (distLabel) distLabel.innerText = distStr;
            if (dispLabel) dispLabel.innerText = dispStr;
            if (mobileDistLabel) mobileDistLabel.innerText = distStr;
            if (mobileDispLabel) mobileDispLabel.innerText = dispStr;
        }

        // Unified Pointer Events
        function getCanvasCoords(e) {
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            
            let clientX, clientY;
            
            if (e.touches) {
                clientX = e.touches[0].clientX;
                clientY = e.touches[0].clientY;
            } else {
                clientX = e.clientX;
                clientY = e.clientY;
            }
            
            return {
                x: (clientX - rect.left) * scaleX,
                y: (clientY - rect.top) * scaleY
            };
        }

        function handlePointerDown(e) {
            e.preventDefault();
            
            if(isStraightened) clearLab();
            isDrawing = true;
            
            const coords = getCanvasCoords(e);
            path.push({x: coords.x, y: coords.y});
            
            if (canvas.setPointerCapture) {
                canvas.setPointerCapture(e.pointerId);
            }
        }

        function handlePointerMove(e) {
            e.preventDefault();
            
            if(isDrawing) {
                const coords = getCanvasCoords(e);
                path.push({x: coords.x, y: coords.y});
            }
        }

        function handlePointerUp(e) {
            e.preventDefault();
            isDrawing = false;
            if (canvas.releasePointerCapture) {
                canvas.releasePointerCapture(e.pointerId);
            }
        }

        function calculateStats() {
            if (path.length < 2) return;
            
            let distance = 0;
            for(let i = 1; i < path.length; i++) {
                distance += Math.hypot(path[i].x - path[i-1].x, path[i].y - path[i-1].y);
            }
            
            const start = path[0];
            const end = path[path.length - 1];
            const displacement = Math.hypot(end.x - start.x, end.y - start.y);
            
            updateLabels(distance, displacement);
        }

        function draw() {
            ctx.clearRect(0, 0, width, height);
            
            // Subtle grid background
            ctx.strokeStyle = '#f1f5f9';
            ctx.lineWidth = 0.5;
            for (let i = 0; i < width; i += 50) {
                ctx.beginPath();
                ctx.moveTo(i, 0);
                ctx.lineTo(i, height);
                ctx.stroke();
            }
            for (let i = 0; i < height; i += 50) {
                ctx.beginPath();
                ctx.moveTo(0, i);
                ctx.lineTo(width, i);
                ctx.stroke();
            }
            
            if (path.length > 1) {
                const start = path[0];
                const end = path[path.length - 1];
                
                // 1. Draw Distance (The Thread) - CORE LOGIC PRESERVED
                ctx.beginPath();
                ctx.strokeStyle = "#e67e22";
                ctx.lineWidth = 4;
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';
                ctx.setLineDash([]);
                
                if (!isStraightened) {
                    // Regular Winding Path with glow effect
                    ctx.shadowColor = '#e67e22';
                    ctx.shadowBlur = 8;
                    ctx.moveTo(start.x, start.y);
                    for(let i = 1; i < path.length; i++) ctx.lineTo(path[i].x, path[i].y);
                    ctx.stroke();
                    
                    // Path dots
                    ctx.shadowBlur = 0;
                    ctx.fillStyle = '#e67e22';
                    for(let i = 0; i < path.length; i += Math.max(1, Math.floor(path.length / 30))) {
                        ctx.beginPath();
                        ctx.arc(path[i].x, path[i].y, 3, 0, Math.PI * 2);
                        ctx.fill();
                    }
                } else {
                    // Animated Straightening - CORE LOGIC PRESERVED
                    ctx.shadowBlur = 0;
                    if(straightenedAnim < 1) straightenedAnim += 0.02;
                    
                    let totalDist = parseFloat(distLabel.innerText) || 0;
                    
                    // Draw original path faded
                    ctx.beginPath();
                    ctx.strokeStyle = "#fde68a";
                    ctx.lineWidth = 2;
                    ctx.moveTo(start.x, start.y);
                    for(let i = 1; i < path.length; i++) ctx.lineTo(path[i].x, path[i].y);
                    ctx.stroke();
                    
                    // Draw straightened line
                    ctx.beginPath();
                    ctx.strokeStyle = "#e67e22";
                    ctx.lineWidth = 5;
                    ctx.shadowColor = '#e67e22';
                    ctx.shadowBlur = 10;
                    ctx.moveTo(start.x, start.y + 45);
                    ctx.lineTo(start.x + (totalDist * straightenedAnim), start.y + 45);
                    ctx.stroke();
                    
                    ctx.shadowBlur = 0;
                    ctx.fillStyle = "#e67e22";
                    ctx.font = "600 13px Inter, sans-serif";
                    ctx.textAlign = "left";
                    ctx.fillText("⟵ UNROLLED DISTANCE (SCALAR) ⟶", start.x, start.y + 35);
                    
                    // Tick marks on straightened line
                    ctx.strokeStyle = "#e67e22";
                    ctx.lineWidth = 2;
                    for (let i = 0; i <= 10; i++) {
                        const tickX = start.x + (totalDist * straightenedAnim * i / 10);
                        ctx.beginPath();
                        ctx.moveTo(tickX, start.y + 35);
                        ctx.lineTo(tickX, start.y + 55);
                        ctx.stroke();
                    }
                }
                
                ctx.shadowBlur = 0;
                
                // 2. Draw Displacement (The Steel Rod / Arrow) - CORE LOGIC PRESERVED
                ctx.beginPath();
                ctx.strokeStyle = "#3b82f6";
                ctx.lineWidth = 5;
                ctx.lineCap = 'round';
                ctx.shadowColor = '#3b82f6';
                ctx.shadowBlur = 12;
                ctx.moveTo(start.x, start.y);
                ctx.lineTo(end.x, end.y);
                ctx.stroke();
                
                // Arrow Head
                ctx.shadowBlur = 8;
                const angle = Math.atan2(end.y - start.y, end.x - start.x);
                ctx.beginPath();
                ctx.fillStyle = "#3b82f6";
                ctx.moveTo(end.x, end.y);
                ctx.lineTo(end.x - 18 * Math.cos(angle - Math.PI/6), end.y - 18 * Math.sin(angle - Math.PI/6));
                ctx.lineTo(end.x - 18 * Math.cos(angle + Math.PI/6), end.y - 18 * Math.sin(angle + Math.PI/6));
                ctx.fill();
                
                ctx.shadowBlur = 0;
                
                // Start Point
                ctx.fillStyle = "#1e293b";
                ctx.shadowColor = 'rgba(0, 0, 0, 0.2)';
                ctx.shadowBlur = 8;
                ctx.beginPath();
                ctx.arc(start.x, start.y, 7, 0, Math.PI * 2);
                ctx.fill();
                
                ctx.fillStyle = "#10b981";
                ctx.beginPath();
                ctx.arc(start.x, start.y, 4, 0, Math.PI * 2);
                ctx.fill();
                
                // End Point
                ctx.fillStyle = "#1e293b";
                ctx.beginPath();
                ctx.arc(end.x, end.y, 7, 0, Math.PI * 2);
                ctx.fill();
                
                ctx.fillStyle = "#ef4444";
                ctx.beginPath();
                ctx.arc(end.x, end.y, 4, 0, Math.PI * 2);
                ctx.fill();
                
                ctx.shadowBlur = 0;
                
                // Labels
                ctx.font = "600 12px Inter, sans-serif";
                ctx.fillStyle = "#10b981";
                ctx.fillText("START", start.x - 25, start.y - 18);
                ctx.fillStyle = "#ef4444";
                ctx.fillText("FINISH", end.x + 10, end.y - 18);
                
                // Displacement value label
                const midX = (start.x + end.x) / 2;
                const midY = (start.y + end.y) / 2;
                ctx.fillStyle = "#3b82f6";
                ctx.font = "600 13px Inter, sans-serif";
                ctx.textAlign = "center";
                ctx.fillText((dispLabel ? dispLabel.innerText : "0") + " m", midX, midY - 15);
                ctx.textAlign = "left";
            } else {
                // Empty canvas hint
                ctx.fillStyle = "#cbd5e1";
                ctx.font = "500 16px Inter, sans-serif";
                ctx.textAlign = "center";
                ctx.fillText("👆 Draw a winding path here", width / 2, height / 2 - 10);
                ctx.font = "400 13px Inter, sans-serif";
                ctx.fillText("Distance = orange thread · Displacement = blue arrow", width / 2, height / 2 + 15);
                ctx.textAlign = "left";
            }
            
            if(!isStraightened) calculateStats();
            requestAnimationFrame(draw);
        }

        // Mobile menu functions
        function openMobileMenu() {
            mobileMenu.classList.add('open');
            mobileMenuOverlay.classList.add('active');
            hamburgerBtn.classList.add('open');
            hamburgerBtn.setAttribute('aria-expanded', 'true');
        }

        function closeMobileMenu() {
            mobileMenu.classList.remove('open');
            mobileMenuOverlay.classList.remove('active');
            hamburgerBtn.classList.remove('open');
            hamburgerBtn.setAttribute('aria-expanded', 'false');
        }

        function toggleMobileMenu() {
            if (mobileMenu.classList.contains('open')) {
                closeMobileMenu();
            } else {
                openMobileMenu();
            }
        }

        // Event listeners
        canvas.addEventListener('pointerdown', handlePointerDown);
        canvas.addEventListener('pointermove', handlePointerMove);
        canvas.addEventListener('pointerup', handlePointerUp);
        canvas.addEventListener('pointercancel', handlePointerUp);
        canvas.addEventListener('contextmenu', (e) => e.preventDefault());
        
        // Desktop buttons
        const straightenBtn = document.getElementById('straightenBtn');
        const clearBtn = document.getElementById('clearBtn');
        if (straightenBtn) {
            straightenBtn.addEventListener('click', straightenThread);
            straightenBtn.addEventListener('touchstart', (e) => { e.preventDefault(); straightenThread(); }, { passive: false });
        }
        if (clearBtn) {
            clearBtn.addEventListener('click', clearLab);
            clearBtn.addEventListener('touchstart', (e) => { e.preventDefault(); clearLab(); }, { passive: false });
        }
        
        // Mobile buttons
        const mobileStraightenBtn = document.getElementById('mobileStraightenBtn');
        const mobileClearBtn = document.getElementById('mobileClearBtn');
        if (mobileStraightenBtn) {
            mobileStraightenBtn.addEventListener('click', () => {
                straightenThread();
                if (window.innerWidth <= 768) {
                    closeMobileMenu();
                }
            });
            mobileStraightenBtn.addEventListener('touchstart', (e) => { 
                e.preventDefault(); 
                straightenThread(); 
                if (window.innerWidth <= 768) closeMobileMenu();
            }, { passive: false });
        }
        if (mobileClearBtn) {
            mobileClearBtn.addEventListener('click', () => {
                clearLab();
                if (window.innerWidth <= 768) {
                    closeMobileMenu();
                }
            });
            mobileClearBtn.addEventListener('touchstart', (e) => { 
                e.preventDefault(); 
                clearLab(); 
                if (window.innerWidth <= 768) closeMobileMenu();
            }, { passive: false });
        }
        
        // Mobile menu event listeners
        if (hamburgerBtn) {
            hamburgerBtn.addEventListener('click', (e) => {
                e.preventDefault();
                e.stopPropagation();
                toggleMobileMenu();
            });
            hamburgerBtn.addEventListener('touchend', (e) => {
                e.preventDefault();
                e.stopPropagation();
                toggleMobileMenu();
            });
        }
        if (mobileMenuClose) {
            mobileMenuClose.addEventListener('click', (e) => {
                e.preventDefault();
                closeMobileMenu();
            });
        }
        if (mobileMenuOverlay) {
            mobileMenuOverlay.addEventListener('click', (e) => {
                e.preventDefault();
                closeMobileMenu();
            });
        }
        
        // Close mobile menu on Escape key
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && mobileMenu.classList.contains('open')) {
                closeMobileMenu();
            }
        });
        
        draw();
    </script>
</body>
</html>
